<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apex Academy — Client Monthly Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;0,9..40,800;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1A365D;--navy2:#2D4A7A;--navy3:#10223B;
  --red:#E03E15;--red2:#C2320E;
  --gold:#D4A017;--gold2:#F0C040;
  --success:#1B7A4A;--success-bg:#EDFBF3;
  --warn:#CC6B00;--warn-bg:#FFF8EC;
  --danger:#C8272C;--danger-bg:#FFF0F0;
  --muted:#718096;--body:#4A5568;--dark:#1E2533;
  --border:#DEE5EF;--surface:#F8FAFC;--white:#FFFFFF;
  --m1:#1A365D;--m2:#0F6B6B;--m3:#5B3A8C;--m4:#B84E0A;
  --font:'DM Sans',system-ui,sans-serif;
  --mono:'DM Mono',monospace;
  --r:8px;--r2:12px;
  --shadow:0 2px 8px rgba(0,0,0,.08);
  --shadow2:0 4px 20px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:#0B1220;color:var(--dark);min-height:100vh}

/* ── APP SHELL ── */
#app-shell{display:flex;flex-direction:column;min-height:100vh}

/* ── TOP BAR ── */
#topbar{
  background:linear-gradient(135deg,var(--navy3) 0%,var(--navy) 100%);
  border-bottom:3px solid var(--red);
  padding:0 32px;height:64px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.topbar-brand{display:flex;align-items:center;gap:14px}
.shield{width:36px;height:40px;position:relative;flex-shrink:0}
.shield svg{width:100%;height:100%}
.brand-text h1{font-size:15pt;font-weight:800;color:#fff;letter-spacing:.12em;text-transform:uppercase;line-height:1}
.brand-text span{font-size:8pt;color:rgba(255,255,255,.55);letter-spacing:.22em;text-transform:uppercase}
.topbar-right{display:flex;align-items:center;gap:10px}
.btn{border:none;border-radius:999px;cursor:pointer;font-family:var(--font);font-weight:700;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--red);color:#fff;padding:9px 20px;font-size:9pt}
.btn-primary:hover{background:var(--red2)}
.btn-ghost{background:rgba(255,255,255,.1);color:#fff;padding:9px 16px;font-size:9pt;border:1px solid rgba(255,255,255,.2)}
.btn-ghost:hover{background:rgba(255,255,255,.18)}
.btn-success{background:var(--success);color:#fff;padding:9px 20px;font-size:9pt}
.btn-success:hover{background:#156339}
#status-dot{width:8px;height:8px;border-radius:50%;background:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.3);flex-shrink:0}
#status-dot.ok{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.3)}
#status-txt{font-size:8.5pt;color:rgba(255,255,255,.6);font-weight:500}

/* ── CONTROLS PANEL ── */
#controls{
  background:linear-gradient(180deg,#111827 0%,#0d1525 100%);
  padding:24px 32px;border-bottom:1px solid rgba(255,255,255,.07);
}
.controls-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;align-items:end}
.field-wrap{display:flex;flex-direction:column;gap:6px}
.field-label{font-size:8pt;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.45)}
.field-select,.field-input{
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);
  border-radius:var(--r);padding:10px 14px;color:#fff;font-family:var(--font);font-size:10pt;
  outline:none;transition:.15s;appearance:none;
}
.field-select:focus,.field-input:focus{border-color:var(--gold2);background:rgba(255,255,255,.1)}
.field-select option{background:#1A2744;color:#fff}
.controls-actions{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}

/* ── LOADING / EMPTY ── */
#loading-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:80px 20px;gap:16px;color:rgba(255,255,255,.4);font-size:11pt;
}
.spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--gold2);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── REPORT PREVIEW ── */
#report-preview{
  background:#e8ecf0;padding:32px;flex:1;
  display:none;
}
#report-preview.show{display:block}
.preview-actions{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:24px;flex-wrap:wrap;gap:12px;
}
.preview-actions h2{font-size:12pt;font-weight:700;color:#fff;letter-spacing:.06em}
.print-hint{font-size:8.5pt;color:rgba(255,255,255,.5);background:rgba(255,255,255,.06);padding:8px 14px;border-radius:6px;border:1px solid rgba(255,255,255,.1)}

/* ── THE REPORT PAGES ── */
.report-page{
  background:#fff;width:210mm;margin:0 auto 24px;
  box-shadow:0 8px 40px rgba(0,0,0,.25);
  border-radius:2px;
  position:relative;overflow:hidden;
}

/* COVER PAGE */
.cover-page{
  height:297mm;
  display:flex;flex-direction:column;
}
.cover-hero{
  background:linear-gradient(145deg,var(--navy3) 0%,var(--navy) 55%,var(--navy2) 100%);
  padding:52px 48px 44px;flex:1;
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
}
.cover-hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 85% 20%,rgba(212,160,23,.18) 0,transparent 55%),
             radial-gradient(circle at 10% 80%,rgba(224,62,21,.14) 0,transparent 45%);
  pointer-events:none;
}
.cover-hero-inner{position:relative;z-index:1;display:flex;flex-direction:column;flex:1;justify-content:space-between;}
.cover-title-block{flex:1}
.cover-logo-row{display:flex;align-items:center;gap:16px;margin-bottom:48px}
.cover-shield{width:52px;height:58px}
.cover-brand-text h1{font-size:22pt;font-weight:800;color:#fff;letter-spacing:.14em;text-transform:uppercase;line-height:1}
.cover-brand-text span{font-size:9pt;color:rgba(255,255,255,.5);letter-spacing:.28em;text-transform:uppercase}
.cover-divider{width:60px;height:4px;background:linear-gradient(90deg,var(--red),var(--gold));border-radius:2px;margin:32px 0}
.cover-doc-type{font-size:9pt;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:10px}
.cover-title{font-size:28pt;font-weight:800;color:#fff;line-height:1.1;margin-bottom:8px}
.cover-subtitle{font-size:13pt;color:rgba(255,255,255,.65);font-weight:400}
.cover-client-block{
  margin-top:auto;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);
  border-radius:var(--r2);padding:24px 28px;
  display:grid;grid-template-columns:1fr 1fr;gap:16px 32px;
}
.cover-field label{font-size:7.5pt;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.4);display:block;margin-bottom:4px}
.cover-field span{font-size:10.5pt;font-weight:600;color:#fff}
.cover-footer{
  background:var(--navy3);padding:20px 48px;
  display:flex;align-items:center;justify-content:space-between;
  border-top:3px solid var(--red);
}
.cover-footer-left{font-size:8pt;color:rgba(255,255,255,.4);letter-spacing:.1em;text-transform:uppercase}
.cover-footer-right{font-size:8pt;color:rgba(255,255,255,.5)}
.cover-period-pill{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(212,160,23,.2);border:1px solid rgba(212,160,23,.4);
  border-radius:999px;padding:6px 16px;margin-top:24px;
}
.cover-period-pill span{font-size:8.5pt;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2)}

/* CONTENT PAGES */
.content-page{padding:0;min-height:297mm;display:flex;flex-direction:column}
.page-header{
  background:var(--navy);padding:16px 40px;
  display:flex;align-items:center;justify-content:space-between;
}
.page-header-left{display:flex;align-items:center;gap:10px}
.page-header-brand{font-size:8pt;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.page-header-title{font-size:8pt;font-weight:600;color:rgba(255,255,255,.35);margin-left:6px}
.page-header-right{font-size:7.5pt;color:rgba(255,255,255,.35);font-family:var(--mono)}
.page-body{padding:28px 40px;flex:1}
.page-footer{
  background:var(--surface);border-top:1px solid var(--border);
  padding:10px 40px;display:flex;align-items:center;justify-content:space-between;
}
.page-footer-text{font-size:7pt;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.page-num{font-size:7pt;color:var(--muted);font-family:var(--mono)}

/* SECTION HEADERS */
.sec-header{
  display:flex;align-items:center;gap:12px;margin-bottom:20px;margin-top:8px;
}
.sec-accent{width:4px;border-radius:2px;align-self:stretch;min-height:28px;flex-shrink:0}
.sec-title{font-size:12pt;font-weight:800;color:var(--navy);letter-spacing:.04em;text-transform:uppercase}
.sec-subtitle{font-size:8.5pt;color:var(--muted);margin-top:2px}

/* INFO CARD GRID */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px}
.info-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;border-left:3px solid var(--navy)}
.info-card.full{grid-column:1/-1}
.info-card label{font-size:7.5pt;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.info-card span{font-size:10pt;font-weight:600;color:var(--dark)}

/* MODULE TIMELINE */
.module-timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:28px}
.mod-card{border-radius:var(--r);padding:14px;border:1px solid var(--border);position:relative;overflow:hidden}
.mod-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.mod-card.m1::before{background:var(--m1)}
.mod-card.m2::before{background:var(--m2)}
.mod-card.m3::before{background:var(--m3)}
.mod-card.m4::before{background:var(--m4)}
.mod-num{font-size:7.5pt;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-bottom:4px}
.mod-card.m1 .mod-num{color:var(--m1)}
.mod-card.m2 .mod-num{color:var(--m2)}
.mod-card.m3 .mod-num{color:var(--m3)}
.mod-card.m4 .mod-num{color:var(--m4)}
.mod-dates{font-size:8pt;color:var(--body);font-weight:500;line-height:1.4}
.mod-units{font-size:7.5pt;color:var(--muted);margin-top:6px;line-height:1.5}

/* NARRATIVE BLOCKS */
.narrative-block{margin-bottom:20px}
.narrative-label{font-size:8pt;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--navy);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.narrative-label::after{content:'';flex:1;height:1px;background:var(--border)}
.narrative-textarea{
  width:100%;border:1px solid var(--border);border-radius:var(--r);
  padding:12px 14px;font-family:var(--font);font-size:9.5pt;color:var(--dark);
  line-height:1.6;resize:vertical;min-height:72px;background:#fff;outline:none;
  transition:.15s;overflow:hidden;
}
.narrative-textarea:focus{border-color:var(--navy2);box-shadow:0 0 0 3px rgba(26,54,93,.08)}
.narrative-static{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:12px 14px;font-size:9.5pt;color:var(--body);line-height:1.6;min-height:40px;
}

/* DUAL RENDER — screen shows textarea/select, print shows plain div/span */
.nar-wrap{position:relative;margin-bottom:20px}
.nar-screen{display:block}
.nar-print{display:none;font-size:9.5pt;color:var(--body);line-height:1.6;padding:4px 0;white-space:pre-wrap;min-height:1em}
.exam-print{display:none}
.result-print{display:none}

/* DATA TABLES */
.data-table{width:100%;border-collapse:collapse;font-size:8.5pt;margin-bottom:24px}
.data-table th{
  background:var(--navy);color:#fff;padding:9px 11px;text-align:left;
  font-size:7.5pt;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
}
.data-table th:first-child{border-radius:var(--r) 0 0 0}
.data-table th:last-child{border-radius:0 var(--r) 0 0}
.data-table td{padding:8px 11px;border-bottom:1px solid var(--border);color:var(--body);vertical-align:top}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:nth-child(even) td{background:#FAFBFD}
.data-table .comment-cell{font-size:8pt;color:var(--muted);line-height:1.5}

/* MODULE SECTION BADGE */
.mod-section-header{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-radius:var(--r);margin-bottom:12px;font-size:8pt;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:#fff;
}
.mod-section-header.m1{background:var(--m1)}
.mod-section-header.m2{background:var(--m2)}
.mod-section-header.m3{background:var(--m3)}
.mod-section-header.m4{background:var(--m4)}

/* BADGES */
.badge{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;font-size:7pt;font-weight:700;padding:3px 9px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.badge-c{background:var(--success-bg);color:var(--success);border:1px solid #9FE1CB}
.badge-nyc{background:var(--warn-bg);color:var(--warn);border:1px solid #FAC775}
.badge-na{background:var(--surface);color:var(--muted);border:1px solid var(--border)}
.badge-pending{background:#EEF2FF;color:#4F46E5;border:1px solid #C7D2FE}

/* ATTENDANCE PILLS */
.att-p{display:inline-block;width:28px;text-align:center;background:var(--success-bg);color:var(--success);border:1px solid #9FE1CB;border-radius:4px;font-size:7.5pt;font-weight:700;padding:2px 0;cursor:pointer}
.att-a{display:inline-block;width:28px;text-align:center;background:var(--danger-bg);color:var(--danger);border:1px solid #F7C1C1;border-radius:4px;font-size:7.5pt;font-weight:700;padding:2px 0;cursor:pointer}
.att-r{display:inline-block;width:28px;text-align:center;background:#FFF0F0;color:#9B1C1C;border:1px solid #F7C1C1;border-radius:4px;font-size:7.5pt;font-weight:700;padding:2px 0;cursor:pointer}
.att-na{display:inline-block;width:28px;text-align:center;background:var(--surface);color:var(--muted);border:1px solid var(--border);border-radius:4px;font-size:7.5pt;font-weight:500;padding:2px 0;cursor:pointer}
td.att-cell{text-align:center;padding:6px 4px}

/* ASSESSMENT INLINE EDIT */
.result-select{
  border:1px solid var(--border);border-radius:4px;padding:3px 6px;
  font-family:var(--font);font-size:8pt;background:#fff;cursor:pointer;
  color:var(--dark);outline:none;
}
.result-select:focus{border-color:var(--navy2)}
.exam-input{
  width:54px;border:1px solid var(--border);border-radius:4px;padding:3px 6px;
  font-family:var(--mono);font-size:8pt;text-align:center;outline:none;background:#fff;
}
.exam-input:focus{border-color:var(--navy2)}

/* SURVEY */
.survey-section-row td{background:#EEF2FF;color:#3730A3;font-weight:700;font-size:8pt;letter-spacing:.1em;text-transform:uppercase;padding:8px 11px}
.survey-check{width:28px;text-align:center;cursor:pointer;user-select:none;font-size:13pt;color:#DDE3ED;display:inline-block}
.survey-check.checked{color:var(--success)}
.survey-comment-row td{background:#FAFBFD;padding:8px 11px}
.survey-comment-input{width:100%;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-family:var(--font);font-size:8.5pt;color:var(--body);resize:vertical;min-height:48px;outline:none}
.survey-comment-input:focus{border-color:var(--navy2)}

/* UNITS TABLE */
.unit-status{font-size:7.5pt;font-weight:700;padding:3px 8px;border-radius:4px;letter-spacing:.06em;text-transform:uppercase}
.unit-complete{background:var(--success-bg);color:var(--success)}
.unit-pending{background:var(--warn-bg);color:var(--warn)}
.unit-nyt{background:var(--surface);color:var(--muted)}

/* SIGN-OFF */
.signoff-block{
  margin-top:32px;
  display:grid;grid-template-columns:1fr 1fr;gap:32px 40px;
  border-top:2px solid var(--border);padding-top:28px;
  page-break-inside:avoid;break-inside:avoid;
}
.signoff-field{display:flex;flex-direction:column;gap:8px;min-height:80px}
.signoff-field label{font-size:7.5pt;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.signoff-input{
  border:none;border-bottom:2px solid var(--border);padding:10px 0;
  font-family:var(--font);font-size:10.5pt;color:var(--dark);outline:none;
  background:transparent;transition:.15s;width:100%;
}
.signoff-input:focus{border-bottom-color:var(--navy)}
.signoff-role{font-size:8pt;color:var(--muted);font-style:italic;margin-top:2px}
.signoff-sig-line{height:48px;border-bottom:2px solid var(--border);margin-top:8px}
.general-feedback-block{
  background:linear-gradient(135deg,var(--surface) 0%,#EEF4FF 100%);
  border:1px solid var(--border);border-left:4px solid var(--navy);
  border-radius:var(--r);padding:16px 18px;margin:20px 0;
}
.general-feedback-block label{font-size:7.5pt;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--navy);display:block;margin-bottom:8px}

/* SAVE INDICATOR */
#save-indicator{
  position:fixed;bottom:24px;right:24px;
  background:var(--navy);color:#fff;border-radius:999px;
  padding:8px 18px;font-size:8.5pt;font-weight:600;
  box-shadow:var(--shadow2);opacity:0;transition:.3s;pointer-events:none;
  z-index:200;
}
#save-indicator.show{opacity:1}

/* ── PRINT STYLES ── */
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  html,body{background:#fff!important;margin:0!important;padding:0!important}
  #app-shell{display:block!important}
  #topbar,#controls,#loading-state,.preview-actions,#save-indicator{display:none!important}
  #report-preview{display:block!important;background:#fff!important;padding:0!important;width:100%!important}
  .report-page{
    box-shadow:none!important;margin:0!important;border-radius:0!important;
    page-break-after:always;break-after:page;
    width:210mm!important;min-height:297mm!important;
    height:auto!important;overflow:visible!important;
    display:flex!important;flex-direction:column!important;
  }
  .report-page:last-child{page-break-after:avoid;break-after:avoid}
  .page-body{flex:1!important;overflow:visible!important;height:auto!important}
  .cover-hero{height:auto!important;min-height:240mm!important}
  .cover-page{height:auto!important;min-height:297mm!important}
  .cover-hero-inner{min-height:232mm!important}
  /* Dual-render: hide screen elements, show print elements */
  .nar-screen{display:none!important}
  .nar-print{display:block!important}
  .exam-screen{display:none!important}
  .exam-print{display:inline!important}
  .result-screen{display:none!important}
  .result-print{display:inline!important}
  /* Hide all form elements in print */
  .narrative-textarea,.field-select,.result-select,.survey-comment-input,.exam-input{
    display:none!important;
  }
  /* Survey */
  .survey-check:not(.checked){visibility:hidden!important;color:transparent!important}
  .survey-check.checked{color:var(--success)!important}
  .att-p,.att-a,.att-r,.att-na{cursor:default!important}
  .signoff-block{page-break-inside:avoid!important;break-inside:avoid!important}
  /* Fix Chrome print grid reflow — use flex so column order is stable */
  .info-grid{display:flex!important;flex-wrap:wrap!important;gap:12px!important}
  .info-grid .info-card{flex:1 1 45%!important}
  .info-grid .info-card.full{flex:1 1 100%!important}
  .module-timeline{display:flex!important;flex-wrap:nowrap!important;gap:8px!important}
  .module-timeline .mod-card{flex:1 1 0!important;min-width:0!important}
  /* Survey — keep General Feedback row attached to the table above it */
  .survey-comment-row{break-inside:avoid!important;page-break-inside:avoid!important;break-before:avoid!important;page-break-before:avoid!important}
  .survey-comment-last{break-before:avoid!important;page-break-before:avoid!important}
  .survey-section-last-group{break-inside:avoid!important;page-break-inside:avoid!important}
  @page{size:A4;margin:0}
}

/* scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:rgba(255,255,255,.04)}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}

/* ── FIELD ROW (select + action buttons) ── */
.field-row{display:flex;gap:6px;align-items:center}
.field-row .field-select{flex:1;min-width:0}
.btn-icon{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);

async function sb(table,params=''){
  const r=await fetch(`${SB_URL}/rest/v1/${table}?${params}`,{headers:{...HEADERS,'Prefer':'return=representation'}});
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}

async function init(){

    applySnapshot(cached);
    setStatus(true,'Loaded from cache');
    document.getElementById('loading-state').style.display='none';
    populateClients();
  }else{
    setStatus(false,'Connecting…');
  }

  if(!isOnline){
    if(!cached){
      setStatus(false,'Offline — no cached data');
      document.getElementById('loading-state').innerHTML=
        `<div style="color:#f87171;font-size:11pt">📡 Offline &amp; no cached data yet.<br><small style="opacity:.6">Open once while online to enable offline use.</small></div>`;
    }else{
      setStatus(false,'Offline — using cached data');
    }

  }

    const [c,p,a]=await Promise.all([
      sb('clients','select=*&order=client_name'),

    setStatus(true,'Connected');
    document.getElementById('loading-state').style.display='none';
    populateClients();
  }catch(e){
    if(!cached){

      document.getElementById('loading-state').style.display='none';

    }else{

}

// Normalise any date string to YYYY-MM-DD for consistent key matching
function normDateKey(d){
  if(!d)return d;
  // Already ISO
  if(/^\d{4}-\d{2}-\d{2}$/.test(d))return d;
  // DD-Mon-YYYY e.g. "11-May-2026"
  const months={Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
  const m=d.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/);
  if(m)return`${m[3]}-${months[m[2]]||'00'}-${m[1].padStart(2,'0')}`;
  return d;
}

function buildEisaState(){
  eisaState={};
  eisa.forEach(r=>{
    if(!eisaState[r.learner_id])eisaState[r.learner_id]={};
    eisaState[r.learner_id][r.module_number||1]={
      km:r.km_result||'',pm:r.pm_result||'',wm:r.wm_result||'',
      examv1:r.exam_v1_result||'',examv2:r.exam_v2_result||'',
      examv1_pct:r.exam_v1_pct||'',examv2_pct:r.exam_v2_pct||''
    };
  });
}

function buildAttState(){
  attState={};
  attendance.forEach(r=>{
    if(!attState[r.learner_id])attState[r.learner_id]={};
    attState[r.learner_id][normDateKey(r.session_date)]=r.status||'P';
  });
}

function loadNarratives(){

}
function saveNarratives(toast=false){
  if(!activeProgramme)return;
  const key=narrativeKey();
  const data={};
  document.querySelectorAll('[data-nar]').forEach(el=>{data[el.dataset.nar]=el.value;});
  // survey
  const sv={};
  document.querySelectorAll('[data-survey-idx]').forEach(el=>{sv[el.dataset.surveyIdx]=el.dataset.checked==='true';});
  data._survey=sv;
  document.querySelectorAll('[data-survey-comment]').forEach(el=>{data['_sc_'+el.dataset.surveyComment]=el.value;});
  // comments
  const cc={};
  document.querySelectorAll('[data-comment-lid]').forEach(el=>{cc[el.dataset.commentLid]=el.value;});
  data._comments=cc;
  // eisa overrides
  const ea={};
  document.querySelectorAll('[data-eisa]').forEach(el=>{ea[el.dataset.eisa]=el.value;});
  data._eisa=ea;
  // att overrides
  const ao={};
  document.querySelectorAll('[data-att]').forEach(el=>{ao[el.dataset.att]=el.textContent;});
  data._att=ao;
  localStorage.setItem(key,JSON.stringify(data));
  if(toast)showSaved();
}

  narratives=loadNarratives();
  const pLearners=getProgrammeLearners();
  const attDates=getAttDates();

  document.getElementById('preview-title').textContent=`${client.client_name} · ${month}`;
  document.getElementById('report-preview').classList.add('show');
  document.getElementById('loading-state').style.display='none';

  const pages=document.getElementById('report-pages');
  pages.innerHTML='';

  pages.appendChild(buildCoverPage(prog,client,month));
  pages.appendChild(buildOverviewPage(prog,client,pLearners));
  pages.appendChild(buildParticipationPage(pLearners,narratives));
  pages.appendChild(buildAttendancePage(pLearners,attDates,narratives));
  pages.appendChild(buildAssessmentPage(pLearners,1,narratives));
  pages.appendChild(buildAssessmentPage(pLearners,2,narratives));
  pages.appendChild(buildAssessmentPage(pLearners,3,narratives));
  pages.appendChild(buildAssessmentPage(pLearners,4,narratives));
  pages.appendChild(buildSurveyPage(narratives));
  pages.appendChild(buildSignoffPage(prog,client,month,narratives));

  // Restore saved values
  if(narratives._survey){
    Object.entries(narratives._survey).forEach(([idx,checked])=>{
      const el=document.querySelector(`[data-survey-idx="${idx}"]`);
      if(el){el.dataset.checked=checked;el.textContent=checked?'●':'○';}
    });
  }
  if(narratives._comments){
    Object.entries(narratives._comments).forEach(([lid,val])=>{
      const el=document.querySelector(`[data-comment-lid="${lid}"]`);
      if(el)el.value=val;
    });
  }
  if(narratives._eisa){
    Object.entries(narratives._eisa).forEach(([key,val])=>{
      const el=document.querySelector(`[data-eisa="${key}"]`);
      if(el)el.value=val;
    });
  }
  if(narratives._att){
    Object.entries(narratives._att).forEach(([key,val])=>{
      const el=document.querySelector(`[data-att="${key}"]`);
      if(el){el.textContent=val;applyAttStyle(el,val);}
    });
  }

  // Scroll to preview
  document.getElementById('report-preview').scrollIntoView({behavior:'smooth'});
}

function buildAttendancePage(pLearners,attDates,nar){
  // Determine columns — use existing dates or show placeholders
  const dates=attDates.length>0?attDates.map(normDateKey):['2026-05-11'];

  // Format date for display in header: YYYY-MM-DD → "11 May 2026"
  function fmtDate(d){
    if(!d||d.startsWith('Date'))return d;
    const [y,m,dy]=d.split('-');
    const mon=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return`${+dy} ${mon[+m]||m} ${y}`;
  }

  const headerCols=dates.map(d=>`
    <th style="text-align:center;min-width:72px;position:relative">
      <span class="att-date-label">${esc(fmtDate(d))}</span>
      <button class="att-remove-date nar-screen" title="Remove this date" onclick="removeAttDate('${d}')">×</button>
    </th>`).join('');

  const rows=pLearners.map(l=>{
    const cells=dates.map(d=>{
      const key=`${l.id}_${d}`;
      const savedAtt=(narratives._att||{})[key];
      const status=savedAtt||(attState[l.id]?.[d])||'';
      const cls=status==='P'?'att-p':status==='A'?'att-a':status==='R'?'att-r':'att-na';
      return`<td class="att-cell"><span class="${cls}" data-att="${key}" onclick="cycleAtt(this)">${status||'—'}</span></td>`;
    }).join('');
    return`<tr><td>${esc(l.first_name)}</td><td>${esc(l.last_name)}</td><td style="font-family:var(--mono);font-size:8pt">${esc(l.id_number)}</td>${cells}</tr>`;
  }).join('');

  const body=`
    <div class="sec-header"><div class="sec-accent" style="background:var(--m2)"></div>
      <div style="flex:1">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
          <div>
            <div class="sec-title">Attendance Register</div>
            <div class="sec-subtitle">Click any cell to cycle: P → A → N/A → R</div>
          </div>
          <div class="nar-screen" style="display:flex;align-items:center;gap:8px">
            <input type="date" id="att-new-date" class="att-date-input" title="Pick a session date">
            <button class="btn btn-ghost" style="padding:7px 14px;font-size:8.5pt" onclick="addAttDate()">＋ Add Date</button>
          </div>
        </div>
      </div>
    </div>
    <div style="overflow-x:auto">
      <table class="data-table" id="att-table">
        <thead><tr><th>First Name</th><th>Surname</th><th>ID Number</th>${headerCols}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px">
      <span class="att-p">P</span><span style="font-size:8pt;color:var(--muted);align-self:center">Present</span>
      <span class="att-a">A</span><span style="font-size:8pt;color:var(--muted);align-self:center">Absent</span>
      <span class="att-na">N/A</span><span style="font-size:8pt;color:var(--muted);align-self:center">Not Applicable</span>
      <span class="att-r">R</span><span style="font-size:8pt;color:var(--muted);align-self:center">Resigned</span>
    </div>`;
  return pageShell(4,11,activeClient.client_name,'Attendance Register',body);
}

function rebuildAttendancePage(){
  const pages=document.getElementById('report-pages');
  if(!pages||!pages.children.length)return;
  const pLearners=getProgrammeLearners();
  const attDates=getAttDates();
  const newPage=buildAttendancePage(pLearners,attDates,narratives);
  // Attendance page is always index 3 (0-based): Cover, Overview, Participation, Attendance
  const old=pages.children[3];
  if(old)pages.replaceChild(newPage,old);
}

function addAttDate(){
  const inp=document.getElementById('att-new-date');
  const raw=(inp?.value||'').trim();
  if(!raw){inp?.focus();return;}
  const key=normDateKey(raw);
  // Add to attState for all learners with blank default
  const pLearners=getProgrammeLearners();
  pLearners.forEach(l=>{
    if(!attState[l.id])attState[l.id]={};
    if(attState[l.id][key]===undefined)attState[l.id][key]='';
  });
  if(inp)inp.value='';
  rebuildAttendancePage();
  autoSave();
}

function removeAttDate(dateKey){
  const pLearners=getProgrammeLearners();
  pLearners.forEach(l=>{
    if(attState[l.id])delete attState[l.id][dateKey];
    // Also remove from saved narratives att overrides
    if(narratives._att){
      Object.keys(narratives._att).forEach(k=>{
        if(k.endsWith('_'+dateKey))delete narratives._att[k];
      });
    }
  });
  rebuildAttendancePage();
  autoSave();
}

function buildAssessmentPage(pLearners,modNum,nar){
  const mColors=['','m1','m2','m3','m4'];
  const mColor=mColors[modNum];
  const units=[,['KM-01','PM-01','WM-01'],['KM-02','PM-02','WM-02'],['KM-03','PM-03','WM-03'],['KM-04','PM-04','WM-04']][modNum];
  const rows=pLearners.map(l=>{
    const res=(eisaState[l.id]||{})[modNum]||{};
    const ek=`${l.id}_m${modNum}`;
    const mkVal=(field,val)=>{const saved=(nar._eisa||{})[`${ek}_${field}`];return saved!==undefined?saved:val||'';};
    const mkResult=(field,val)=>{
      const v=mkVal(field,val);
      const bc=v==='C'?'badge-c':v==='NYC'?'badge-nyc':'badge-na';
      return`<div style="text-align:center"><select class="result-select result-screen" data-eisa="${ek}_${field}" onchange="syncResult(this)"><option value="">&#8212;</option><option value="C" ${v==='C'?'selected':''}>C</option><option value="NYC" ${v==='NYC'?'selected':''}>NYC</option></select><span class="result-print badge ${bc}">${v||'&#8212;'}</span></div>`;
    };
    const mkExam=(field,pctField,val,pct)=>{
      const v=mkVal(field,val);const p=mkVal(pctField,pct);
      const bc=v==='C'?'badge-c':v==='NYC'?'badge-nyc':'badge-na';
      const pt=v?(p?v+' / '+p+'%':v):'&#8212;';
      return`<div style="text-align:center"><div class="exam-screen" style="display:flex;flex-direction:column;align-items:center;gap:2px"><select class="result-select" data-eisa="${ek}_${field}" onchange="syncResult(this)"><option value="">&#8212;</option><option value="C" ${v==='C'?'selected':''}>C</option><option value="NYC" ${v==='NYC'?'selected':''}>NYC</option><option value="N/A" ${v==='N/A'?'selected':''}>N/A</option></select><input class="exam-input" type="text" placeholder="%" data-eisa="${ek}_${pctField}" value="${p}" oninput="syncExamPct(this)" maxlength="6"></div><span class="exam-print badge ${v?bc:'badge-na'}" data-eisa-print="${ek}_${field}">${pt}</span></div>`;
    };
    const km=mkVal('km',res.km),pm=mkVal('pm',res.pm),wm=mkVal('wm',res.wm),ev1=mkVal('examv1',res.examv1);
    const allC=[km,pm,wm,ev1].every(v=>v==='C');
    const anyNYC=[km,pm,wm,ev1].some(v=>v==='NYC');
    const overall=allC?'<span class="badge badge-c">Complete</span>':anyNYC?'<span class="badge badge-nyc">In Progress</span>':'<span class="badge badge-pending">Pending</span>';
    return`<tr><td>${esc(l.first_name)} ${esc(l.last_name)}</td><td style="font-family:var(--mono);font-size:7.5pt">${esc(l.id_number)}</td><td>${mkResult('km',res.km)}</td><td>${mkResult('pm',res.pm)}</td><td>${mkResult('wm',res.wm)}</td><td>${mkExam('examv1','examv1_pct',res.examv1,res.examv1_pct)}</td><td>${mkExam('examv2','examv2_pct',res.examv2,res.examv2_pct)}</td><td style="text-align:center">${overall}</td></tr>`;
  }).join('');
  const body=`<div class="mod-section-header ${mColor}">Assessment Results &#8212; Module ${modNum} &nbsp;&middot;&nbsp; ${units.join(' &middot; ')}</div><table class="data-table" style="break-inside:avoid;page-break-inside:avoid"><thead><tr><th>Learner Name</th><th>ID Number</th><th style="text-align:center">${units[0]}</th><th style="text-align:center">${units[1]}</th><th style="text-align:center">${units[2]}</th><th style="text-align:center">Exam V1</th><th style="text-align:center">Exam V2</th><th style="text-align:center">Status</th></tr></thead><tbody>${rows}</tbody></table><div style="display:flex;gap:12px;margin-top:8px;flex-wrap:wrap"><span class="badge badge-c">C = Competent</span><span class="badge badge-nyc">NYC = Not Yet Competent</span><span class="badge badge-na">&#8212; = Not Yet Assessed</span></div>`;
  return pageShell(4+modNum,11,activeClient.client_name,'Assessment &#8212; Module '+modNum,body);
}

function buildSurveyPage(nar){
  const cols=['Poor','Sufficient','Above Standard','Excellent'];
  let qi=0;
  // Separate out the general_feedback comment — it will render outside the table
  const tableItems=SURVEY_ITEMS.filter(item=>!item.comment||item.comment!=='general_feedback');
  const gfVal=(nar['_sc_general_feedback'])||'';

  let rows=tableItems.map((item,idx)=>{
    if(item.section){
      return`<tr class="survey-section-row"><td colspan="5">${esc(item.section)}</td></tr>`;
    }
    if(item.comment){
      const savedVal=(nar['_sc_'+item.comment])||'';
      return`<tr class="survey-comment-row"><td colspan="5">
        <div style="font-size:8pt;font-weight:700;color:var(--navy);margin-bottom:6px">${esc(item.label)}</div>
        <textarea class="survey-comment-input nar-screen" data-survey-comment="${item.comment}" oninput="syncSurveyComment(this)">${esc(savedVal)}</textarea>
        <div class="nar-print" data-survey-comment-print="${item.comment}" style="font-size:8.5pt;color:var(--body);line-height:1.6;padding:4px 0;white-space:pre-wrap">${esc(savedVal)}</div>
      </td></tr>`;
    }
    const qIdx=qi++;
    const savedChecked=(nar._survey||{})[qIdx];
    return`<tr>
      <td style="font-size:8.5pt">${esc(item.q)}</td>
      ${cols.map((c,ci)=>{
        const isChecked=savedChecked!==undefined?savedChecked:false;
        return`<td style="text-align:center;width:80px">
          <span class="survey-check ${isChecked?'checked':''}" data-survey-idx="${qIdx}" data-col="${c}" data-checked="${isChecked}" onclick="toggleSurvey(this)">${isChecked?'●':'○'}</span>
        </td>`;
      }).join('')}
    </tr>`;
  }).join('');

  const body=`
    <div class="sec-header"><div class="sec-accent" style="background:var(--m3)"></div>
      <div><div class="sec-title">Training Evaluation Survey</div><div class="sec-subtitle">Click circles to toggle rating selections</div></div>
    </div>
    <table class="data-table">
      <thead><tr><th>Criteria / Question</th><th style="text-align:center">Poor</th><th style="text-align:center">Sufficient</th><th style="text-align:center">Above Standard</th><th style="text-align:center;background:#156339">Excellent</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div style="margin-top:12px;break-before:avoid;page-break-before:avoid;break-inside:avoid;page-break-inside:avoid;border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;background:#FAFBFD">
      <div style="font-size:8pt;font-weight:700;color:var(--navy);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px">General Feedback</div>
      <textarea class="survey-comment-input nar-screen" data-survey-comment="general_feedback" oninput="syncSurveyComment(this)" style="min-height:56px">${esc(gfVal)}</textarea>
      <div class="nar-print" data-survey-comment-print="general_feedback" style="font-size:8.5pt;color:var(--body);line-height:1.6;padding:4px 0;white-space:pre-wrap;min-height:1.5em">${esc(gfVal)}</div>
    </div>`;
  return pageShell(9,11,activeClient.client_name,'Training Evaluation Survey',body);
}

function buildUnitsTable(prog){
  const allUnits=[
    {mod:1,cls:'m1',id:'KM-01',title:'Administration and record keeping in Insurance',level:5,credits:16},
    {mod:1,cls:'m1',id:'PM-01',title:'Apply and adhere to operational and administrative procedures',level:5,credits:13},
    {mod:1,cls:'m1',id:'WM-01',title:'Exposure to operational and administrative underwriting procedures',level:5,credits:17},
    {mod:2,cls:'m2',id:'KM-02',title:'Insurance Risk management for Underwriters',level:5,credits:16},
    {mod:2,cls:'m2',id:'PM-02',title:'Evaluate risk information to determine risk profile and manage risk exposure',level:5,credits:8},
    {mod:2,cls:'m2',id:'WM-02',title:'Evaluation and management of risk profile and/or exposure',level:5,credits:12},
    {mod:3,cls:'m3',id:'KM-03',title:'Application of legal and Insurance principles',level:5,credits:8},
    {mod:3,cls:'m3',id:'PM-03',title:'Apply basic legal and insurance principles to underwriting recommendations',level:5,credits:6},
    {mod:3,cls:'m3',id:'WM-03',title:'Application of legal and insurance principles to underwriting processes',level:5,credits:12},
    {mod:4,cls:'m4',id:'KM-04',title:'Rating and Pricing of insurance risks and products',level:5,credits:8},
    {mod:4,cls:'m4',id:'PM-04',title:'Apply knowledge of product and pricing to underwrite profitable risks',level:5,credits:13},
    {mod:4,cls:'m4',id:'WM-04',title:'Exposure to processes and factors leading up to final underwriting decision',level:5,credits:27},
  ];
  const totalCredits=allUnits.reduce((s,u)=>s+u.credits,0);
  const modLabels=['Module 1','Module 2','Module 3','Module 4'];
  let lastMod=0;
  const rows=allUnits.map(u=>{
    let modHeader='';
    if(u.mod!==lastMod){
      lastMod=u.mod;
      const colors=['#1A365D','#0F6B6B','#5B3A8C','#B84E0A'];
      modHeader=`<tr><td colspan="5" style="background:${colors[u.mod-1]};color:#fff;font-weight:700;font-size:7.5pt;letter-spacing:.12em;text-transform:uppercase;padding:7px 11px">Module ${u.mod}</td></tr>`;
    }
    const status=u.mod===1?`<span class="unit-status unit-complete">Trained</span>`:`<span class="unit-status unit-nyt">Not Yet Trained</span>`;
    return modHeader+`<tr><td style="font-family:var(--mono);font-size:8pt">${esc(u.id)}</td><td>${esc(u.title)}</td><td style="text-align:center">${u.level}</td><td style="text-align:center">${u.credits}</td><td style="text-align:center">${status}</td></tr>`;
  }).join('');
  return`<table class="data-table">
    <thead><tr><th style="width:70px">US ID</th><th>Unit Standard Title</th><th style="text-align:center;width:55px">Level</th><th style="text-align:center;width:60px">Credits</th><th style="text-align:center;width:100px">Status</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td colspan="3" style="text-align:right;padding:8px 11px;font-weight:700;font-size:8.5pt;color:var(--navy)">Total Credits:</td><td style="text-align:center;font-weight:800;font-size:10pt;color:var(--navy)">${totalCredits}</td><td></td></tr></tfoot>
  </table>`;
}

// ── Interactivity ──
function cycleAtt(el){
  const map={'P':'A','A':'N/A','N/A':'R','R':'P','—':'P','':'P'};
  const cur=el.textContent.trim();
  const next=map[cur]||'P';
  el.textContent=next;
  applyAttStyle(el,next);
  autoSave();
}
function applyAttStyle(el,status){
  el.className='';
  el.classList.add(status==='P'?'att-p':status==='A'?'att-a':status==='R'?'att-r':'att-na');
}

function toggleSurvey(el){
  const row=el.closest('tr');
  // Uncheck all in row
  row.querySelectorAll('.survey-check').forEach(s=>{s.dataset.checked='false';s.textContent='○';s.classList.remove('checked');});
  // Check this one
  el.dataset.checked='true';el.textContent='●';el.classList.add('checked');
  autoSave();
}

// Dual-render sync functions
function syncNar(ta){
  const key=ta.dataset.nar;
  const printEl=document.querySelector(`[data-nar-print="${key}"]`);
  if(printEl)printEl.textContent=ta.value;
  autoSave();
}
function syncComment(ta){
  const lid=ta.dataset.commentLid;
  const printEl=document.querySelector(`[data-comment-print="${lid}"]`);
  if(printEl)printEl.textContent=ta.value;
  autoSave();
}
function syncResult(sel){
  // Update print span sibling
  const printSpan=sel.nextElementSibling;
  if(printSpan&&printSpan.classList.contains('result-print')){
    const v=sel.value;
    printSpan.className='result-print badge '+(v==='C'?'badge-c':v==='NYC'?'badge-nyc':'badge-na');
    printSpan.textContent=v||'—';
  }
  autoSave();
}
function syncSurveyComment(ta){
  const key=ta.dataset.surveyComment;
  const el=document.querySelector(`[data-survey-comment-print="${key}"]`);
  if(el)el.textContent=ta.value;
  autoSave();
}
function syncExamPct(inp){
  // Resolve the matching print span via data-eisa-print (same key as the select's data-eisa)
  const screenWrap=inp.closest('.exam-screen');
  const sel=screenWrap?.querySelector('select');
  if(sel){
    const key=sel.dataset.eisa;
    const printSpan=document.querySelector(`[data-eisa-print="${key}"]`);
    if(printSpan){
      const v=sel.value;
      const p=inp.value;
      const bc=v==='C'?'badge-c':v==='NYC'?'badge-nyc':'badge-na';
      printSpan.className='result-print badge '+(v?bc:'badge-na');
      printSpan.textContent=v?(p?v+' / '+p+'%':v):'—';
    }
  }
  autoSave();
}

// ── Supabase write helpers ──
async function sbPost(table,body){
  const r=await fetch(`${SB_URL}/rest/v1/${table}`,{
    method:'POST',
    headers:{...HEADERS,'Prefer':'return=representation'},
    body:JSON.stringify(body)
  });
  if(!r.ok)throw new Error(await r.text());
  const d=await r.json();
  return Array.isArray(d)?d[0]:d;
}
async function sbPatch(table,id,body){
  const r=await fetch(`${SB_URL}/rest/v1/${table}?id=eq.${id}`,{
    method:'PATCH',
    headers:{...HEADERS,'Prefer':'return=representation'},
    body:JSON.stringify(body)
  });
  if(!r.ok)throw new Error(await r.text());
  const d=await r.json();
  return Array.isArray(d)?d[0]:d;
}

// ── Modal state ──

let modalMode=null; // 'add' | 'edit'

  modalType=type;modalMode=mode;

  const v=s=>esc(isEdit&&src?src[s]||'':'');

    (isEdit?'Edit ':'Add ')+( type==='client'?'Client':'Programme');

  let html=`<div class="modal-error" id="modal-err"></div>`;

  if(type==='client'){
    html+=`
      <div class="modal-field"><label>Client Name *</label>
        <input class="modal-input" id="mf-client_name" placeholder="e.g. OMI – Old Mutual Insure Limited" value="${v('client_name')}">

      <div class="modal-grid">

        </div>

        </div>
      </div>
      <div class="modal-field"><label>Contact Email</label>

    html+=`
      <div class="modal-field"><label>Programme Name *</label>
        <input class="modal-input" id="mf-programme_name" placeholder="e.g. OC: Insurance Underwriter NQF Level 5" value="${v('programme_name')}">

        </div>
        <div class="modal-field"><label>Qualification Code</label>
          <input class="modal-input" id="mf-qualification_code" placeholder="e.g. 91784" value="${v('qualification_code')}">
        </div>
      </div>
      <div class="modal-grid">
        <div class="modal-field"><label>Facilitator</label>
          <select class="modal-select" id="mf-facilitator_id">
            <option value="">— Select —</option>${aOpts}
          </select>
        </div>
        <div class="modal-field"><label>Group Name</label>
          <input class="modal-input" id="mf-group_name" placeholder="e.g. One Group" value="${v('group_name')}">
        </div>
      </div>
      <div class="modal-field" style="max-width:160px"><label>Group Size</label>
        <input class="modal-input" id="mf-group_size" type="number" min="1" placeholder="e.g. 16" value="${isEdit&&src?src.group_size||'':''}">
      </div>

function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
  modalType=null;modalMode=null;
}
function onOverlayClick(e){if(e.target===document.getElementById('modal-overlay'))closeModal();}

function modalErr(msg){
  const el=document.getElementById('modal-err');
  el.textContent=msg;el.classList.add('show');
}
function mval(id){return(document.getElementById(id)?.value||'').trim();}

async function saveModal(){
  const btn=document.getElementById('modal-save-btn');
  btn.disabled=true;btn.textContent='Saving…';
  const errEl=document.getElementById('modal-err');
  errEl.classList.remove('show');

  try{
    if(modalType==='client'){
      const name=mval('mf-client_name');
      if(!name){modalErr('Client Name is required.');btn.disabled=false;btn.textContent=modalMode==='edit'?'Save Changes':'Add';return;}
      const payload={
        client_name:name,
        contact_person:mval('mf-contact_person')||null,
        contact_number:mval('mf-contact_number')||null,
        contact_email:mval('mf-contact_email')||null,
      };
      let saved;
      if(isOnline){
        saved=modalMode==='edit'
          ?await sbPatch('clients',activeClient.id,payload)
          :await sbPost('clients',payload);
      } else {
        // Offline: mutate local array
        if(modalMode==='edit'){
          Object.assign(activeClient,payload);saved=activeClient;
        } else {
          saved={...payload,id:Date.now()};clients.push(saved);
        }
      }
      // Refresh local array
      if(modalMode==='edit'){
        const idx=clients.findIndex(c=>c.id===saved.id);
        if(idx>-1)clients[idx]=saved;
        activeClient=saved;
      } else {
        if(!clients.find(c=>c.id===saved.id))clients.push(saved);
      }
      // Rebuild dropdown, select new record
      const sel=document.getElementById('sel-client');
      sel.innerHTML='<option value="">— Select client —</option>';
      clients.forEach(c=>{
        const o=document.createElement('option');
        o.value=c.id;o.textContent=c.client_name;
        sel.appendChild(o);
      });
      sel.value=saved.id;
      onClientChange();

    } else {
      // Programme
      const name=mval('mf-programme_name');
      const saqa=mval('mf-saqa_id');
      if(!name||!saqa){modalErr('Programme Name and SAQA ID are required.');btn.disabled=false;btn.textContent=modalMode==='edit'?'Save Changes':'Add';return;}
      const fid=document.getElementById('mf-facilitator_id')?.value;
      const gs=document.getElementById('mf-group_size')?.value;
      const payload={
        client_id:activeClient.id,
        programme_name:name,
        saqa_id:saqa,
        qualification_code:mval('mf-qualification_code')||null,
        facilitator_id:fid?+fid:null,
        group_name:mval('mf-group_name')||null,
        group_size:gs?+gs:null,
        module_1_dates:mval('mf-module_1_dates')||null,
        module_2_dates:mval('mf-module_2_dates')||null,
        module_3_dates:mval('mf-module_3_dates')||null,
        module_4_dates:mval('mf-module_4_dates')||null,
      };
      let saved;
      if(isOnline){
        saved=modalMode==='edit'
          ?await sbPatch('programmes',activeProgramme.id,payload)
          :await sbPost('programmes',payload);
      } else {
        if(modalMode==='edit'){
          Object.assign(activeProgramme,payload);saved=activeProgramme;
        } else {
          saved={...payload,id:Date.now()};programmes.push(saved);
        }
      }
      if(modalMode==='edit'){
        const idx=programmes.findIndex(p=>p.id===saved.id);
        if(idx>-1)programmes[idx]=saved;
        activeProgramme=saved;
      } else {
        if(!programmes.find(p=>p.id===saved.id))programmes.push(saved);
      }
      // Rebuild programme dropdown for current client
      const sel=document.getElementById('sel-programme');
      sel.innerHTML='<option value="">— Select programme —</option>';
      programmes.filter(p=>p.client_id===activeClient.id).forEach(p=>{
        const o=document.createElement('option');
        o.value=p.id;o.textContent=p.programme_name;
        sel.appendChild(o);
      });
      sel.value=saved.id;
      onProgrammeChange();
    }

    saveSnapshot({clients,programmes,assessors,learners,enrolments,attendance,eisa});
    closeModal();
    showSaved();

  }catch(err){
    modalErr('Save failed: '+err.message);
    btn.disabled=false;
    btn.textContent=modalMode==='edit'?'Save Changes':'Add';
  }
}
