<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apex Academy — Client Monthly Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;0,9..40,800;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1A365D;--navy2:#2D4A7A;--navy3:#10223B;
  --red:#E03E15;--red2:#C2320E;
  --gold:#D4A017;--gold2:#F0C040;
  --success:#1B7A4A;--success-bg:#EDFBF3;
  --warn:#CC6B00;--warn-bg:#FFF8EC;
  --danger:#C8272C;--danger-bg:#FFF0F0;
  --muted:#718096;--body:#4A5568;--dark:#1E2533;
  --border:#DEE5EF;--surface:#F8FAFC;--white:#FFFFFF;
  --m1:#1A365D;--m2:#0F6B6B;--m3:#5B3A8C;--m4:#B84E0A;
  --font:'DM Sans',system-ui,sans-serif;
  --mono:'DM Mono',monospace;
  --r:8px;--r2:12px;
  --shadow:0 2px 8px rgba(0,0,0,.08);
  --shadow2:0 4px 20px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:#0B1220;color:var(--dark);min-height:100vh}

/* ── APP SHELL ── */
#app-shell{display:flex;flex-direction:column;min-height:100vh}

/* ── TOP BAR ── */
#topbar{
  background:linear-gradient(135deg,var(--navy3) 0%,var(--navy) 100%);
  border-bottom:3px solid var(--red);
  padding:0 32px;height:64px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.topbar-brand{display:flex;align-items:center;gap:14px}
.shield{width:36px;height:40px;position:relative;flex-shrink:0}
.shield svg{width:100%;height:100%}
.brand-text h1{font-size:15pt;font-weight:800;color:#fff;letter-spacing:.12em;text-transform:uppercase;line-height:1}
.brand-text span{font-size:8pt;color:rgba(255,255,255,.55);letter-spacing:.22em;text-transform:uppercase}
.topbar-right{display:flex;align-items:center;gap:10px}
.btn{border:none;border-radius:999px;cursor:pointer;font-family:var(--font);font-weight:700;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--red);color:#fff;padding:9px 20px;font-size:9pt}
.btn-primary:hover{background:var(--red2)}
.btn-ghost{background:rgba(255,255,255,.1);color:#fff;padding:9px 16px;font-size:9pt;border:1px solid rgba(255,255,255,.2)}
.btn-ghost:hover{background:rgba(255,255,255,.18)}
.btn-success{background:var(--success);color:#fff;padding:9px 20px;font-size:9pt}
.btn-success:hover{background:#156339}
#status-dot{width:8px;height:8px;border-radius:50%;background:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.3);flex-shrink:0}
#status-dot.ok{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.3)}
#status-txt{font-size:8.5pt;color:rgba(255,255,255,.6);font-weight:500}

/* ── CONTROLS PANEL ── */
#controls{
  background:linear-gradient(180deg,#111827 0%,#0d1525 100%);
  padding:24px 32px;border-bottom:1px solid rgba(255,255,255,.07);
}
.controls-grid{display:grid;grid-template-columns:160px 1fr 1fr 200px auto;gap:16px;align-items:end}
@media(max-width:1100px){.controls-grid{grid-template-columns:1fr 1fr 1fr;}}
@media(max-width:700px){.controls-grid{grid-template-columns:1fr 1fr;}}
.field-wrap{display:flex;flex-direction:column;gap:6px}
.field-label{font-size:8pt;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.45)}
.field-select,.field-input{
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);
  border-radius:var(--r);padding:10px 14px;color:#fff;font-family:var(--font);font-size:10pt;
  outline:none;transition:.15s;appearance:none;
}
.field-select:focus,.field-input:focus{border-color:var(--gold2);background:rgba(255,255,255,.1)}
.field-select option{background:#1A2744;color:#fff}
.controls-actions{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}

/* ── LOADING / EMPTY ── */
#loading-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:80px 20px;gap:16px;color:rgba(255,255,255,.4);font-size:11pt;
}
.spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--gold2);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── REPORT PREVIEW ── */
#report-preview{
  background:#e8ecf0;padding:32px;flex:1;
  display:none;
}
#report-preview.show{display:block}
.preview-actions{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:24px;flex-wrap:wrap;gap:12px;
}
.preview-actions h2{font-size:12pt;font-weight:700;color:#fff;letter-spacing:.06em}
.print-hint{font-size:8.5pt;color:rgba(255,255,255,.5);background:rgba(255,255,255,.06);padding:8px 14px;border-radius:6px;border:1px solid rgba(255,255,255,.1)}

/* ── THE REPORT PAGES ── */
.report-page{
  background:#fff;width:210mm;margin:0 auto 24px;
  box-shadow:0 8px 40px rgba(0,0,0,.25);
  border-radius:2px;
  position:relative;overflow:hidden;
}

/* COVER PAGE */
.cover-page{
  height:297mm;
  display:flex;flex-direction:column;
}
.cover-hero{
  background:linear-gradient(145deg,var(--navy3) 0%,var(--navy) 55%,var(--navy2) 100%);
  padding:52px 48px 44px;flex:1;
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
}
.cover-hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 85% 20%,rgba(212,160,23,.18) 0,transparent 55%),
             radial-gradient(circle at 10% 80%,rgba(224,62,21,.14) 0,transparent 45%);
  pointer-events:none;
}
.cover-hero-inner{position:relative;z-index:1;display:flex;flex-direction:column;flex:1;justify-content:space-between;}
.cover-title-block{flex:1}
.cover-logo-row{display:flex;align-items:center;gap:16px;margin-bottom:48px}
.cover-shield{width:52px;height:58px}
.cover-brand-text h1{font-size:22pt;font-weight:800;color:#fff;letter-spacing:.14em;text-transform:uppercase;line-height:1}
.cover-brand-text span{font-size:9pt;color:rgba(255,255,255,.5);letter-spacing:.28em;text-transform:uppercase}
.cover-divider{width:60px;height:4px;background:linear-gradient(90deg,var(--red),var(--gold));border-radius:2px;margin:32px 0}
.cover-doc-type{font-size:9pt;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:10px}
.cover-title{font-size:28pt;font-weight:800;color:#fff;line-height:1.1;margin-bottom:8px}
.cover-subtitle{font-size:13pt;color:rgba(255,255,255,.65);font-weight:400}
.cover-client-block{
  margin-top:auto;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);
  border-radius:var(--r2);padding:24px 28px;
  display:grid;grid-template-columns:1fr 1fr;gap:16px 32px;
}
.cover-field label{font-size:7.5pt;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.4);display:block;margin-bottom:4px}
.cover-field span{font-size:10.5pt;font-weight:600;color:#fff}
.cover-footer{
  background:var(--navy3);padding:20px 48px;
  display:flex;align-items:center;justify-content:space-between;
  border-top:3px solid var(--red);
}
.cover-footer-left{font-size:8pt;color:rgba(255,255,255,.4);letter-spacing:.1em;text-transform:uppercase}
.cover-footer-right{font-size:8pt;color:rgba(255,255,255,.5)}
.cover-period-pill{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(212,160,23,.2);border:1px solid rgba(212,160,23,.4);
  border-radius:999px;padding:6px 16px;margin-top:24px;
}
.cover-period-pill span{font-size:8.5pt;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2)}

/* CONTENT PAGES */
.content-page{padding:0;min-height:297mm;display:flex;flex-direction:column}
.page-header{
  background:var(--navy);padding:16px 40px;
  display:flex;align-items:center;justify-content:space-between;
}
.page-header-left{display:flex;align-items:center;gap:10px}
.page-header-brand{font-size:8pt;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.page-header-title{font-size:8pt;font-weight:600;color:rgba(255,255,255,.35);margin-left:6px}
.page-header-right{font-size:7.5pt;color:rgba(255,255,255,.35);font-family:var(--mono)}
.page-body{padding:28px 40px;flex:1}
.page-footer{
  background:var(--surface);border-top:1px solid var(--border);
  padding:10px 40px;display:flex;align-items:center;justify-content:space-between;
}
.page-footer-text{font-size:7pt;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.page-num{font-size:7pt;color:var(--muted);font-family:var(--mono)}

/* SECTION HEADERS */
.sec-header{
  display:flex;align-items:center;gap:12px;margin-bottom:20px;margin-top:8px;flex-wrap:wrap;
}
.sec-accent{width:4px;border-radius:2px;align-self:stretch;min-height:28px;flex-shrink:0}
.sec-title{font-size:12pt;font-weight:800;color:var(--navy);letter-spacing:.04em;text-transform:uppercase}
.sec-subtitle{font-size:8.5pt;color:var(--muted);margin-top:2px}

/* INFO CARD GRID */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px}
.info-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;border-left:3px solid var(--navy)}
.info-card.full{grid-column:1/-1}
.info-card label{font-size:7.5pt;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.info-card span{font-size:10pt;font-weight:600;color:var(--dark)}

/* MODULE TIMELINE */
.module-timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:28px}
.mod-card{border-radius:var(--r);padding:14px;border:1px solid var(--border);position:relative;}
.mod-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.mod-card.m1::before{background:var(--m1)}
.mod-card.m2::before{background:var(--m2)}
.mod-card.m3::before{background:var(--m3)}
.mod-card.m4::before{background:var(--m4)}
.mod-num{font-size:7.5pt;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-bottom:4px}
.mod-card.m1 .mod-num{color:var(--m1)}
.mod-card.m2 .mod-num{color:var(--m2)}
.mod-card.m3 .mod-num{color:var(--m3)}
.mod-card.m4 .mod-num{color:var(--m4)}
.mod-dates{font-size:8pt;color:var(--body);font-weight:500;line-height:1.4}
.mod-dates-input{
  font-size:8pt;color:var(--body);font-weight:500;line-height:1.4;
  border:none;border-bottom:1.5px dashed var(--border);background:transparent;
  width:100%;outline:none;font-family:var(--font);padding:1px 0;
  transition:.15s;cursor:text;
}
.mod-dates-input:hover{border-bottom-color:var(--navy2)}
.mod-dates-input:focus{border-bottom-color:var(--navy);border-bottom-style:solid;}
.mod-card:hover .mod-edit-hint{opacity:1}
.mod-edit-hint{
  position:absolute;top:6px;right:8px;font-size:7pt;color:var(--muted);
  opacity:0;transition:.15s;pointer-events:none;letter-spacing:.04em;
}
@media print{.mod-dates-input{display:none!important}.mod-dates-print{display:block!important}.mod-edit-hint{display:none!important}}
.mod-units{font-size:7.5pt;color:var(--muted);margin-top:6px;line-height:1.5}
.mod-dates-print{display:none}
.mod-card.needs-input{border-color:var(--gold);animation:pulse-border 2s ease-in-out infinite}
.mod-card.needs-input .mod-edit-hint{opacity:1;color:var(--gold)}
.mod-card.needs-input .mod-dates-input{border-bottom-color:var(--gold);border-bottom-style:solid}
@keyframes pulse-border{0%,100%{box-shadow:0 0 0 0 rgba(212,160,23,.3)}50%{box-shadow:0 0 0 4px rgba(212,160,23,.15)}}
.info-card.needs-input{border-left-color:var(--gold)!important}
.info-card.needs-input span::after{content:' — click ✏ to fill in';font-size:7.5pt;color:var(--gold);font-style:italic;font-weight:400}

/* NARRATIVE BLOCKS */
.narrative-block{margin-bottom:20px}
.narrative-label{font-size:8pt;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--navy);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.narrative-label::after{content:'';flex:1;height:1px;background:var(--border)}
.narrative-textarea{
  width:100%;border:1px solid var(--border);border-radius:var(--r);
  padding:12px 14px;font-family:var(--font);font-size:9.5pt;color:var(--dark);
  line-height:1.6;resize:vertical;min-height:72px;background:#fff;outline:none;
  transition:.15s;overflow:hidden;
}
.narrative-textarea:focus{border-color:var(--navy2);box-shadow:0 0 0 3px rgba(26,54,93,.08)}
.narrative-static{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:12px 14px;font-size:9.5pt;color:var(--body);line-height:1.6;min-height:40px;
}

/* DUAL RENDER — screen shows textarea/select, print shows plain div/span */
.nar-wrap{position:relative;margin-bottom:20px}
.nar-screen{display:block}
.nar-print{display:none;font-size:9.5pt;color:var(--body);line-height:1.6;padding:4px 0;white-space:pre-wrap;min-height:1em}
.exam-print{display:none}
.result-print{display:none}

/* DATA TABLES */
.data-table{width:100%;border-collapse:collapse;font-size:8.5pt;margin-bottom:24px}
.data-table th{
  background:var(--navy);color:#fff;padding:9px 11px;text-align:left;
  font-size:7.5pt;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
}
.data-table th:first-child{border-radius:var(--r) 0 0 0}
.data-table th:last-child{border-radius:0 var(--r) 0 0}
.data-table td{padding:8px 11px;border-bottom:1px solid var(--border);color:var(--body);vertical-align:top}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:nth-child(even) td{background:#FAFBFD}
.data-table .comment-cell{font-size:8pt;color:var(--muted);line-height:1.5}
.comment-ta.comment-default{border-left:3px solid var(--gold)!important;border-radius:0 var(--r) var(--r) 0}

/* MODULE SECTION BADGE */
.mod-section-header{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-radius:var(--r);margin-bottom:12px;font-size:8pt;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:#fff;
}
.mod-section-header.m1{background:var(--m1)}
.mod-section-header.m2{background:var(--m2)}
.mod-section-header.m3{background:var(--m3)}
.mod-section-header.m4{background:var(--m4)}

/* BADGES */
.badge{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;font-size:7pt;font-weight:700;padding:3px 9px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.badge-c{background:var(--success-bg);color:var(--success);border:1px solid #9FE1CB}
.badge-nyc{background:var(--warn-bg);color:var(--warn);border:1px solid #FAC775}
.badge-na{background:var(--surface);color:var(--muted);border:1px solid var(--border)}
.badge-pending{background:#EEF2FF;color:#4F46E5;border:1px solid #C7D2FE}

/* ATTENDANCE PILLS */
.att-p{display:inline-block;width:28px;text-align:center;background:var(--success-bg);color:var(--success);border:1px solid #9FE1CB;border-radius:4px;font-size:7.5pt;font-weight:700;padding:2px 0;cursor:pointer}
.att-a{display:inline-block;width:28px;text-align:center;background:var(--danger-bg);color:var(--danger);border:1px solid #F7C1C1;border-radius:4px;font-size:7.5pt;font-weight:700;padding:2px 0;cursor:pointer}
.att-r{display:inline-block;width:28px;text-align:center;background:#FFF0F0;color:#9B1C1C;border:1px solid #F7C1C1;border-radius:4px;font-size:7.5pt;font-weight:700;padding:2px 0;cursor:pointer}
.att-na{display:inline-block;width:28px;text-align:center;background:var(--surface);color:var(--muted);border:1px solid var(--border);border-radius:4px;font-size:7.5pt;font-weight:500;padding:2px 0;cursor:pointer}
td.att-cell{text-align:center;padding:6px 4px}

/* ASSESSMENT INLINE EDIT */
.result-select{
  border:1px solid var(--border);border-radius:4px;padding:3px 6px;
  font-family:var(--font);font-size:8pt;background:#fff;cursor:pointer;
  color:var(--dark);outline:none;
}
.result-select:focus{border-color:var(--navy2)}
.exam-input{
  width:54px;border:1px solid var(--border);border-radius:4px;padding:3px 6px;
  font-family:var(--mono);font-size:8pt;text-align:center;outline:none;background:#fff;
}
.exam-input:focus{border-color:var(--navy2)}

/* SURVEY */
.survey-section-row td{background:#EEF2FF;color:#3730A3;font-weight:700;font-size:8pt;letter-spacing:.1em;text-transform:uppercase;padding:8px 11px}
.survey-check{width:28px;text-align:center;cursor:pointer;user-select:none;font-size:13pt;color:#DDE3ED;display:inline-block}
.survey-check.checked{color:var(--success)}
.survey-comment-row td{background:#FAFBFD;padding:8px 11px}
.survey-comment-input{width:100%;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-family:var(--font);font-size:8.5pt;color:var(--body);resize:vertical;min-height:48px;outline:none}
.survey-comment-input:focus{border-color:var(--navy2)}

/* UNITS TABLE */
.unit-status{font-size:7.5pt;font-weight:700;padding:3px 8px;border-radius:4px;letter-spacing:.06em;text-transform:uppercase}
.unit-complete{background:var(--success-bg);color:var(--success)}
.unit-pending{background:var(--warn-bg);color:var(--warn)}
.unit-nyt{background:var(--surface);color:var(--muted)}

/* SIGN-OFF */
.signoff-block{
  margin-top:32px;
  display:grid;grid-template-columns:1fr 1fr;gap:32px 40px;
  border-top:2px solid var(--border);padding-top:28px;
  page-break-inside:avoid;break-inside:avoid;
}
.signoff-field{display:flex;flex-direction:column;gap:8px;min-height:80px}
.signoff-field label{font-size:7.5pt;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.signoff-input{
  border:none;border-bottom:2px solid var(--border);padding:10px 0;
  font-family:var(--font);font-size:10.5pt;color:var(--dark);outline:none;
  background:transparent;transition:.15s;width:100%;
}
.signoff-input:focus{border-bottom-color:var(--navy)}
.signoff-role{font-size:8pt;color:var(--muted);font-style:italic;margin-top:2px}
.signoff-sig-line{height:48px;border-bottom:2px solid var(--border);margin-top:8px}
.general-feedback-block{
  background:linear-gradient(135deg,var(--surface) 0%,#EEF4FF 100%);
  border:1px solid var(--border);border-left:4px solid var(--navy);
  border-radius:var(--r);padding:16px 18px;margin:20px 0;
}
.general-feedback-block label{font-size:7.5pt;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--navy);display:block;margin-bottom:8px}

/* SAVE INDICATOR */
#save-indicator{
  position:fixed;bottom:24px;right:24px;
  background:var(--navy);color:#fff;border-radius:999px;
  padding:8px 18px;font-size:8.5pt;font-weight:600;
  box-shadow:var(--shadow2);opacity:0;transition:.3s;pointer-events:none;
  z-index:200;
}
#save-indicator.show{opacity:1}

/* ── PRINT STYLES ── */
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  html,body{background:#fff!important;margin:0!important;padding:0!important}
  #app-shell{display:block!important}
  #topbar,#controls,#loading-state,.preview-actions,#save-indicator{display:none!important}
  #report-preview{display:block!important;background:#fff!important;padding:0!important;width:100%!important}
  .report-page{
    box-shadow:none!important;margin:0!important;border-radius:0!important;
    page-break-after:always;break-after:page;
    width:210mm!important;min-height:297mm!important;
    height:auto!important;overflow:visible!important;
    display:flex!important;flex-direction:column!important;
  }
  .report-page:last-child{page-break-after:avoid;break-after:avoid}
  .page-body{flex:1!important;overflow:visible!important;height:auto!important}
  .cover-hero{height:auto!important;min-height:240mm!important}
  .cover-page{height:auto!important;min-height:297mm!important}
  .cover-hero-inner{min-height:232mm!important}
  /* Dual-render: hide screen elements, show print elements */
  .nar-screen{display:none!important}
  .nar-print{display:block!important}
  .exam-screen{display:none!important}
  .exam-print{display:inline!important}
  .result-screen{display:none!important}
  .result-print{display:inline!important}
  /* Hide all form elements in print */

// ── Supabase fetch ──
async function sb(table,params=''){
  const r=await fetch(`${SB_URL}/rest/v1/${table}?${params}`,{headers:{...HEADERS,'Prefer':'return=representation'}});
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}

// ── Tenant branding — applies tenants table data to topbar + provider config ──
function applyTenantBranding(t){
  // Update topbar name
  const nameEl=document.getElementById('topbar-name');
  if(nameEl&&t.name)nameEl.textContent=t.name;
  // Inject into activeProvider so cover page + headers use DB values
  if(t.name)activeProvider.name=t.name;
  if(t.footer_text)activeProvider.footer=t.footer_text;
  if(t.name)activeProvider.headerBrand=t.name.toUpperCase();
  if(t.primary_color)activeProvider.gradMid=t.primary_color;
  if(t.accent_color)activeProvider.accentFrom=t.accent_color;
  if(t.signoff_name)window._tenantSignoffName=t.signoff_name;
  if(t.signoff_role)window._tenantSignoffRole=t.signoff_role;
}

// ── Init ──
async function init(){
  // Try cache first for instant load
  const cached=loadSnapshot();
  if(cached){
    applySnapshot(cached);
    setStatus(true,'Loaded from cache');
    document.getElementById('loading-state').style.display='none';
    populateClients();
    updateDraftsCount();
  }else{
    setStatus(false,'Ready');
  }

  if(!isOnline){
    if(!cached){
      showEmptyState();
    }else{
      setStatus(false,'Offline — using cached data');
    }
    return;
  }

  try{
    const [c,p,a,t]=await Promise.all([
      sb('clients',`select=*&tenant_id=eq.${TENANT_ID}&order=client_name`),
      sb('programmes',`select=*&tenant_id=eq.${TENANT_ID}&order=programme_name`),
      sb('assessors',`select=*&tenant_id=eq.${TENANT_ID}`),
      sb('tenants',`select=*&id=eq.${TENANT_ID}&limit=1`)
    ]);
    clients=c; programmes=p; assessors=a;
    if(t&&t[0])applyTenantBranding(t[0]);
    saveSnapshot({clients,programmes,assessors,learners,enrolments,attendance,eisa});
    setStatus(true,'Ready');
    document.getElementById('loading-state').style.display='none';
    populateClients();
    updateDraftsCount();
  }catch(e){
    if(!cached){
      setStatus(false,'Add data manually or import Excel');
      document.getElementById('loading-state').style.display='none';
      showEmptyState();
    }else{
      setStatus(false,'Offline — using cached data');
    }
  }
}

function saveSnapshot(data){
  try{
    // Always persist clients/programmes/assessors globally
    const base=loadSnapshot()||{};
    base.clients=data.clients||base.clients;
    base.programmes=data.programmes||base.programmes;
    base.assessors=data.assessors||base.assessors;
    // Store learner/attendance/eisa data keyed by programme id
    if(activeProgramme&&data.learners!==undefined){
      if(!base.byProgramme)base.byProgramme={};
      base.byProgramme[activeProgramme.id]={
        learners:data.learners,
        enrolments:data.enrolments,
        attendance:data.attendance,
        eisa:data.eisa,
      };
    }
    localStorage.setItem(CACHE_KEY,JSON.stringify(base));
  }catch{}
}
function loadSnapshot(){
  try{const d=localStorage.getItem(CACHE_KEY);return d?JSON.parse(d):null;}catch{return null;}
}
function applySnapshot(snap){
  if(snap.clients)clients=snap.clients;
  if(snap.programmes)programmes=snap.programmes;
  if(snap.assessors)assessors=snap.assessors;
  // Don't restore learners/enrolments globally — loaded per programme in onProgrammeChange
}

function onClientChange(){
  const cid=+document.getElementById('sel-client').value;
  activeClient=clients.find(c=>c.id===cid)||null;
  const sel=document.getElementById('sel-programme');
  sel.innerHTML='<option value="">— Select programme —</option>';
  document.getElementById('btn-edit-client').disabled=!activeClient;
  document.getElementById('btn-add-prog').disabled=!activeClient;
  document.getElementById('btn-edit-prog').disabled=true;
  document.getElementById('btn-learners').disabled=true;
  document.getElementById('btn-unit-standards').disabled=true;
  document.getElementById('gen-btn').disabled=true;
  if(!cid)return;
  programmes.filter(p=>p.client_id===cid).forEach(p=>{
    const o=document.createElement('option');
    o.value=p.id;o.textContent=p.programme_name;
    sel.appendChild(o);
  });
  const filtered=programmes.filter(p=>p.client_id===cid);
  if(filtered.length===1){sel.value=filtered[0].id;onProgrammeChange();}
}

async function onProgrammeChange(){
  const pid=+document.getElementById('sel-programme').value;
  activeProgramme=programmes.find(p=>p.id===pid)||null;
  document.getElementById('gen-btn').disabled=!activeProgramme;
  document.getElementById('btn-edit-prog').disabled=!activeProgramme;
  document.getElementById('btn-learners').disabled=!activeProgramme;
  document.getElementById('btn-unit-standards').disabled=!activeProgramme;
  if(!activeProgramme)return;

  // Always clear stale learner/enrolment/attendance/eisa data from previous programme
  learners=[];enrolments=[];attendance=[];eisa=[];
  attState={};eisaState={};

  if(isOnline){
    try{
      // Fetch enrolled learners via join — only learners for this programme, no full-table scan
      const enrolled=await sb(
        'enrolments',
        `select=*,learner:learners(*)&tenant_id=eq.${TENANT_ID}&programme_id=eq.${pid}&order=learner(last_name)`
      );
      // Unpack: enrolments array with nested learner object
      enrolments=enrolled.map(e=>({id:e.id,programme_id:e.programme_id,learner_id:e.learner_id,status:e.status}));
      learners=enrolled.map(e=>e.learner).filter(Boolean);

      const [att,ei]=await Promise.all([
        sb('attendance',`select=*&tenant_id=eq.${TENANT_ID}&programme_id=eq.${pid}`),
        sb('eisa',`select=*&tenant_id=eq.${TENANT_ID}&programme_id=eq.${pid}`)
      ]);
      attendance=att;eisa=ei;
      saveSnapshot({clients,programmes,assessors,learners,enrolments,attendance,eisa});
      buildEisaState();
      buildAttState();
      // Fetch unit standards for this qualification from Supabase
      if(activeProgramme.saqa_id){
        try{
          const usRows=await sb('unit_standards',`select=*&tenant_id=eq.${TENANT_ID}&saqa_id=eq.${encodeURIComponent(activeProgramme.saqa_id)}&order=module_number,us_id`);
          if(usRows.length){
            const fromDB=usRows.map(r=>({
              mod:+r.module_number||1,
              id:r.us_id||r.id,
              title:r.us_title||r.title||'',
              level:r.us_level||r.level||'',
              credits:+r.us_credits||+r.credits||0,
              saqa_id:r.saqa_id||activeProgramme.saqa_id,
            }));
            unitStandards=[
              ...unitStandards.filter(u=>u.saqa_id&&u.saqa_id!==activeProgramme.saqa_id),
              ...fromDB
            ];
          }
        }catch(e){console.warn('Unit standards fetch failed:',e.message);}
      }
    }catch(e){
      // Offline or error — fall through to cached/demo state
      console.warn('Programme load failed:',e.message);
    }
  } else {
    // Offline — restore from per-programme cache if available
    const snap=loadSnapshot();
    const cached=snap?.byProgramme?.[pid];
    if(cached){
      enrolments=cached.enrolments||[];
      learners=cached.learners||[];
      attendance=cached.attendance||[];
      eisa=cached.eisa||[];
      buildEisaState();
      buildAttState();
    }
  }
}

// Normalise any date string to YYYY-MM-DD for consistent key matching
function normDateKey(d){
  if(!d)return d;
  // Already ISO
  if(/^\d{4}-\d{2}-\d{2}$/.test(d))return d;
  // DD-Mon-YYYY e.g. "11-May-2026"
  const months={Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
  const m=d.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/);
  if(m)return`${m[3]}-${months[m[2]]||'00'}-${m[1].padStart(2,'0')}`;
  return d;
}

function buildEisaState(){
  eisaState={};
  eisa.forEach(r=>{
    if(!eisaState[r.learner_id])eisaState[r.learner_id]={};
    eisaState[r.learner_id][r.module_number||1]={
      km:r.km_result||'',pm:r.pm_result||'',wm:r.wm_result||'',
      examv1:r.exam_v1_result||'',examv2:r.exam_v2_result||'',
      examv1_pct:r.exam_v1_pct||'',examv2_pct:r.exam_v2_pct||''
    };
  });
}

function buildAttState(){
  attState={};
  attendance.forEach(r=>{
    if(!attState[r.learner_id])attState[r.learner_id]={};
    attState[r.learner_id][normDateKey(r.session_date)]=r.status||'P';
  });
}

// ── Narrative persistence ──
function narrativeKey(){return`apex_report_${activeProgramme?.id}_${document.getElementById('sel-month').value}`;}
function loadNarratives(){
  try{const d=localStorage.getItem(narrativeKey());return d?JSON.parse(d):{};}catch{return{};}
}
function saveNarratives(toast=false){
  if(!activeProgramme)return;
  const key=narrativeKey();
  const data={};
  document.querySelectorAll('[data-nar]').forEach(el=>{data[el.dataset.nar]=el.value;});
  // survey
  const sv={};
  // Only record the checked element per question (store column name, not boolean)
  document.querySelectorAll('[data-survey-idx].checked').forEach(el=>{sv[el.dataset.surveyIdx]=el.dataset.col;});
  data._survey=sv;
  document.querySelectorAll('[data-survey-comment]').forEach(el=>{data['_sc_'+el.dataset.surveyComment]=el.value;});
  // comments
  const cc={};
  document.querySelectorAll('[data-comment-lid]').forEach(el=>{cc[el.dataset.commentLid]=el.value;});
  data._comments=cc;
  // eisa overrides
  const ea={};
  document.querySelectorAll('[data-eisa]').forEach(el=>{ea[el.dataset.eisa]=el.value;});
  data._eisa=ea;
  // att overrides
  const ao={};
  document.querySelectorAll('[data-att]').forEach(el=>{ao[el.dataset.att]=el.textContent;});
  data._att=ao;
  // meta — enables draft listing and resume
  data._meta={
    clientId:activeClient?.id,
    clientName:activeClient?.client_name||'',
    progId:activeProgramme.id,
    progName:activeProgramme.programme_name||'',
    month:document.getElementById('sel-month').value,
    savedAt:Date.now(),
  };
  localStorage.setItem(key,JSON.stringify(data));
  updateDraftsCount();
  if(toast)showSaved();
}
function showSaved(){
  const el=document.getElementById('save-indicator');
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2000);
}

// ── Helpers ──
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function getAssessor(id){return assessors.find(a=>a.id===id)?.full_name||'—';}
function getProgrammeLearners(){
  // learners is already scoped to the selected programme via the join fetch.
  // Enrolments check kept as a safety net for demo/offline mode.
  if(enrolments.length===0)return learners;
  const enrolled=new Set(enrolments.map(e=>e.learner_id));
  return learners.filter(l=>enrolled.has(l.id));
}
function getAttDates(){
  const dates=new Set();
  Object.values(attState).forEach(d=>Object.keys(d).forEach(k=>dates.add(normDateKey(k))));
  return [...dates].sort();
}

// ── Shield SVG (inline for print) ──
function shieldSVG(size=36,prov){
  const p=prov||activeProvider||PROVIDERS.apex;
  const uid=`sg${size}${p.id}`;
  return`<svg width="${size}" height="${Math.round(size*1.1)}" viewBox="0 0 52 58" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M26 2L4 12v18c0 12 9.5 22.5 22 26 12.5-3.5 22-14 22-26V12L26 2z" fill="url(#${uid})" stroke="rgba(0,0,0,.1)" stroke-width="1"/>
    <text x="26" y="36" text-anchor="middle" font-family="DM Sans,sans-serif" font-weight="900" font-size="20" fill="#111827">${p.shieldLetter}</text>
    <defs><linearGradient id="${uid}" x1="4" y1="2" x2="48" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="${p.shieldFrom}"/><stop offset="100%" stop-color="${p.shieldTo}"/>
    </linearGradient></defs>
  </svg>`;
}

// ── REPORT GENERATION ──
let TOTAL_PAGES=11; // updated dynamically before each build

function generateReport(){
  const month=document.getElementById('sel-month').value;
  const prog=activeProgramme;
  const client=activeClient;
  if(!prog||!client)return;

  narratives=loadNarratives();
  const pLearners=getProgrammeLearners();
  const attDates=getAttDates();

  // Compute total pages: 1 cover + 1 overview + 1 participation + 1 attendance
  // + 4 assessment + 1 survey + 2 signoff = 11 base
  // (participation may be 2 pages if >SPLIT learners — count tables)
  const participationPages=Math.ceil(pLearners.length/8)||1;
  TOTAL_PAGES=1+1+participationPages+1+4+1+2;

  document.getElementById('preview-title').textContent=`${client.client_name} · ${month}`;
  document.getElementById('report-preview').classList.add('show');
  document.getElementById('loading-state').style.display='none';

  const pages=document.getElementById('report-pages');
  pages.innerHTML='';

  let pn=1;
  pages.appendChild(buildCoverPage(prog,client,month));
  pages.appendChild(buildOverviewPage(prog,client,pLearners,++pn));
  // Participation may span multiple logical pages but lives in one .report-page
  pages.appendChild(buildParticipationPage(pLearners,narratives,++pn));
  if(participationPages>1)pn+=participationPages-1;
  pages.appendChild(makeAttPageWrap(pLearners,attDates,++pn));
  pages.appendChild(buildAssessmentPage(pLearners,1,narratives,++pn));
  pages.appendChild(buildAssessmentPage(pLearners,2,narratives,++pn));
  pages.appendChild(buildAssessmentPage(pLearners,3,narratives,++pn));
  pages.appendChild(buildAssessmentPage(pLearners,4,narratives,++pn));
  pages.appendChild(buildSurveyPage(narratives,++pn));
  pages.appendChild(buildSignoffPage(prog,client,month,narratives,++pn));

  // Restore saved values
  if(narratives._survey){
    Object.entries(narratives._survey).forEach(([idx,checked])=>{
      const el=document.querySelector(`[data-survey-idx="${idx}"]`);
      if(el){el.dataset.checked=checked;el.textContent=checked?'●':'○';}
    });
  }
  if(narratives._comments){
    Object.entries(narratives._comments).forEach(([lid,val])=>{
      const el=document.querySelector(`[data-comment-lid="${lid}"]`);
      if(el)el.value=val;
    });
  }
  if(narratives._eisa){
    Object.entries(narratives._eisa).forEach(([key,val])=>{
      const el=document.querySelector(`[data-eisa="${key}"]`);
      if(el)el.value=val;
    });
  }
  if(narratives._att){
    Object.entries(narratives._att).forEach(([key,val])=>{
      const el=document.querySelector(`[data-att="${key}"]`);
      if(el){el.textContent=val;applyAttStyle(el,val);}
    });
  }

  // Scroll to preview
  document.getElementById('report-preview').scrollIntoView({behavior:'smooth'});
}

// Dual-render narrative: textarea for screen, div for print (synced)

  const v=val||'';
  return`<div class="nar-wrap">
    <textarea class="narrative-textarea nar-screen" data-nar="${key}" oninput="syncNar(this)" placeholder="${placeholder}" style="min-height:${minH};${style}">${esc(v)}</textarea>
    <div class="nar-print" data-nar-print="${key}">${esc(v)||`<span style="color:#aaa;font-style:italic">${placeholder}</span>`}</div>

}

    <div class="module-timeline">${mods.map(m=>`
      <div class="mod-card ${m.cls}${!m.dates?' needs-input':''}">
        <div class="mod-edit-hint">${m.dates?'✎ click to edit':'✎ add dates'}</div>
        <div class="mod-num">${m.label}</div>
        <input class="mod-dates-input no-print" type="text"
          value="${esc(m.dates)}"

          data-mod-field="${m.field}"

    <div class="sec-header" style="margin-top:12px"><div class="sec-accent" style="background:var(--red)"></div>

function buildAttendancePage(pLearners,attDates,nar,pn=4){
  const dates=attDates.length>0?attDates.map(normDateKey):[];

  // Format date for display in header: YYYY-MM-DD → "11 May 2026"
  function fmtDate(d){
    if(!d||d.startsWith('Date'))return d;
    const [y,m,dy]=d.split('-');
    const mon=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return`${+dy} ${mon[+m]||m} ${y}`;
  }

  const headerCols=dates.map(d=>`
    <th style="text-align:center;min-width:72px;position:relative;padding-right:20px">
      <span class="att-date-label">${esc(fmtDate(d))}</span>
      <button class="att-remove-date no-print" title="Remove this date" onclick="removeAttDate('${d}')">×</button>
    </th>`).join('');

  const rows=pLearners.map(l=>{
    const cells=dates.map(d=>{
      const key=`${l.id}_${d}`;

function rebuildAttendancePage(){
  const pages=document.getElementById('report-pages');
  if(!pages||!pages.children.length)return;
  const pLearners=getProgrammeLearners();
  const attDates=getAttDates();
  const newWrap=makeAttPageWrap(pLearners,attDates);

  const old=pages.children[3];

function addAttDate(){
  const inp=document.getElementById('att-new-date');
  const raw=(inp?.value||'').trim();
  if(!raw){inp?.focus();return;}
  const key=normDateKey(raw);
  // Add to attState for all learners with blank default
  const pLearners=getProgrammeLearners();
  pLearners.forEach(l=>{
    if(!attState[l.id])attState[l.id]={};
    if(attState[l.id][key]===undefined)attState[l.id][key]='';
  });
  if(inp)inp.value='';
  rebuildAttendancePage();
  autoSave();
}

function removeAttDate(dateKey){
  const pLearners=getProgrammeLearners();
  pLearners.forEach(l=>{
    if(attState[l.id])delete attState[l.id][dateKey];
    // Also remove from saved narratives att overrides
    if(narratives._att){
      Object.keys(narratives._att).forEach(k=>{
        if(k.endsWith('_'+dateKey))delete narratives._att[k];
      });
    }
  });
  rebuildAttendancePage();
  autoSave();
}

function buildAssessmentPage(pLearners,modNum,nar,pn){
  const mColors=['','m1','m2','m3','m4'];

  const rows=pLearners.map(l=>{
    const res=(eisaState[l.id]||{})[modNum]||{};
    const ek=`${l.id}_m${modNum}`;
    const mkVal=(field,val)=>{const saved=(nar._eisa||{})[`${ek}_${field}`];return saved!==undefined?saved:val||'';};
    const mkResult=(field,val)=>{
      const v=mkVal(field,val);
      const bc=v==='C'?'badge-c':v==='NYC'?'badge-nyc':'badge-na';
      return`<div style="text-align:center"><select class="result-select result-screen" data-eisa="${ek}_${field}" onchange="syncResult(this)"><option value="">&#8212;</option><option value="C" ${v==='C'?'selected':''}>C</option><option value="NYC" ${v==='NYC'?'selected':''}>NYC</option></select><span class="result-print badge ${bc}">${v||'&#8212;'}</span></div>`;
    };
    const mkExam=(field,pctField,val,pct)=>{
      const v=mkVal(field,val);const p=mkVal(pctField,pct);
      const bc=v==='C'?'badge-c':v==='NYC'?'badge-nyc':'badge-na';
      const pt=v?(p?v+' / '+p+'%':v):'&#8212;';
      return`<div style="text-align:center"><div class="exam-screen" style="display:flex;flex-direction:column;align-items:center;gap:2px"><select class="result-select" data-eisa="${ek}_${field}" onchange="syncResult(this)"><option value="">&#8212;</option><option value="C" ${v==='C'?'selected':''}>C</option><option value="NYC" ${v==='NYC'?'selected':''}>NYC</option><option value="N/A" ${v==='N/A'?'selected':''}>N/A</option></select><input class="exam-input" type="text" placeholder="%" data-eisa="${ek}_${pctField}" value="${p}" oninput="syncExamPct(this)" maxlength="6"></div><span class="exam-print badge ${v?bc:'badge-na'}" data-eisa-print="${ek}_${field}">${pt}</span></div>`;
    };
    const km=mkVal('km',res.km),pm=mkVal('pm',res.pm),wm=mkVal('wm',res.wm),ev1=mkVal('examv1',res.examv1);
    const allC=[km,pm,wm,ev1].every(v=>v==='C');
    const anyNYC=[km,pm,wm,ev1].some(v=>v==='NYC');
    const overall=allC?'<span class="badge badge-c">Complete</span>':anyNYC?'<span class="badge badge-nyc">In Progress</span>':'<span class="badge badge-pending">Pending</span>';
    return`<tr><td>${esc(l.first_name)} ${esc(l.last_name)}</td><td style="font-family:var(--mono);font-size:7.5pt">${esc(l.id_number)}</td><td>${mkResult('km',res.km)}</td><td>${mkResult('pm',res.pm)}</td><td>${mkResult('wm',res.wm)}</td><td>${mkExam('examv1','examv1_pct',res.examv1,res.examv1_pct)}</td><td>${mkExam('examv2','examv2_pct',res.examv2,res.examv2_pct)}</td><td style="text-align:center">${overall}</td></tr>`;
  }).join('');
  const body=`<div class="mod-section-header ${mColor}">Assessment Results &#8212; Module ${modNum} &nbsp;&middot;&nbsp; ${units.join(' &middot; ')}</div><table class="data-table" style="break-inside:avoid;page-break-inside:avoid"><thead><tr><th>Learner Name</th><th>ID Number</th><th style="text-align:center">${units[0]}</th><th style="text-align:center">${units[1]}</th><th style="text-align:center">${units[2]}</th><th style="text-align:center">Exam V1</th><th style="text-align:center">Exam V2</th><th style="text-align:center">Status</th></tr></thead><tbody>${rows}</tbody></table><div style="display:flex;gap:12px;margin-top:8px;flex-wrap:wrap"><span class="badge badge-c">C = Competent</span><span class="badge badge-nyc">NYC = Not Yet Competent</span><span class="badge badge-na">&#8212; = Not Yet Assessed</span></div>`;

function getModuleTrainingStatus(modNum){
  // Returns 'trained' | 'progress' | 'nyt' based on eisaState across all learners
  const pLearners=getProgrammeLearners();
  if(!pLearners.length)return'nyt';
  let allTrained=true,anyProgress=false;
  pLearners.forEach(l=>{
    const res=(eisaState[l.id]||{})[modNum]||{};
    const km=res.km||'',pm=res.pm||'',wm=res.wm||'',ev1=res.examv1||'';
    const modComplete=km==='C'&&pm==='C'&&ev1==='C';
    const modStarted=km||pm||wm||ev1;
    if(!modComplete)allTrained=false;
    if(modStarted&&!modComplete)anyProgress=true;
  });
  if(allTrained)return'trained';
  if(anyProgress)return'progress';
  return'nyt';
}

function buildUnitsTable(prog){
  const modColors=['#1A365D','#0F6B6B','#5B3A8C','#B84E0A'];
  const units=unitStandards.filter(u=>!u.saqa_id||u.saqa_id===prog.saqa_id);
  if(!units.length){
    return`<div style="padding:20px;text-align:center;color:var(--muted);font-size:9pt;font-style:italic">
      No unit standards loaded for this qualification.<br>
      Include US ID, US Title, US Level, US Credits and Module Number columns in your Excel import.
    </div>`;
  }
  const totalCredits=units.reduce((s,u)=>s+u.credits,0);
  // Pre-compute status per module from actual assessment data
  const modStatus={1:getModuleTrainingStatus(1),2:getModuleTrainingStatus(2),3:getModuleTrainingStatus(3),4:getModuleTrainingStatus(4)};
  let lastMod=0;
  const rows=units.map(u=>{
    let modHeader='';
    if(u.mod!==lastMod){
      lastMod=u.mod;
      modHeader=`<tr><td colspan="5" style="background:${modColors[(u.mod-1)%4]};color:#fff;font-weight:700;font-size:7.5pt;letter-spacing:.12em;text-transform:uppercase;padding:7px 11px">Module ${u.mod}</td></tr>`;
    }
    const st=modStatus[u.mod]||'nyt';
    const status=st==='trained'
      ?`<span class="unit-status unit-complete">Trained</span>`
      :st==='progress'
      ?`<span class="unit-status unit-pending">In Progress</span>`
      :`<span class="unit-status unit-nyt">Not Yet Trained</span>`;
    return modHeader+`<tr><td style="font-family:var(--mono);font-size:8pt">${esc(u.id)}</td><td>${esc(u.title)}</td><td style="text-align:center">${u.level}</td><td style="text-align:center">${u.credits}</td><td style="text-align:center">${status}</td></tr>`;
  }).join('');
  return`<table class="data-table">
    <thead><tr><th style="width:70px">US ID</th><th>Unit Standard Title</th><th style="text-align:center;width:55px">Level</th><th style="text-align:center;width:60px">Credits</th><th style="text-align:center;width:100px">Status</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td colspan="3" style="text-align:right;padding:8px 11px;font-weight:700;font-size:8.5pt;color:var(--navy)">Total Credits:</td><td style="text-align:center;font-weight:800;font-size:10pt;color:var(--navy)">${totalCredits}</td><td></td></tr></tfoot>
  </table>`;
}

function cycleAtt(el){
  const map={'P':'A','A':'N/A','N/A':'R','R':'P','—':'P','':'P'};
  const cur=el.textContent.trim();
  const next=map[cur]||'P';
  el.textContent=next;
  applyAttStyle(el,next);
  // Sync to Supabase attendance table
  const key=el.dataset.att; // format: {learner_id}_{YYYY-MM-DD}
  if(key&&activeProgramme&&isOnline){
    const [learnerId,sessionDate]=key.split(/_(.+)/); // split on first underscore only
    if(learnerId&&sessionDate){
      const payload={
        tenant_id:TENANT_ID,
        learner_id:+learnerId,
        programme_id:activeProgramme.id,
        session_date:sessionDate,
        status:next,
      };
      sbUpsert('attendance',payload).catch(e=>console.warn('Attendance sync failed:',e.message));
    }
  }
  autoSave();
}
function applyAttStyle(el,status){
  el.className='';
  el.classList.add(status==='P'?'att-p':status==='A'?'att-a':status==='R'?'att-r':'att-na');
}

function toggleSurvey(el){
  const row=el.closest('tr');

  row.querySelectorAll('.survey-check').forEach(s=>{s.dataset.checked='false';s.textContent='○';s.classList.remove('checked');});
  // Check this one
  el.dataset.checked='true';el.textContent='●';el.classList.add('checked');
  autoSave();
}

// ── EISA Supabase sync ──
// data-eisa key format: {learner_id}_m{module}_{field}
// e.g. "42_m2_km", "42_m2_examv1", "42_m2_examv1_pct"
function syncEisaToSupabase(changedEl){
  if(!activeProgramme||!isOnline)return;
  const eisaKey=changedEl.dataset.eisa; // e.g. "42_m2_km"
  if(!eisaKey)return;
  // Parse: learnerId_m{mod}_{field} — support fields like examv1_pct
  const m=eisaKey.match(/^(\d+)_m(\d+)_(.+)$/);
  if(!m)return;
  const [,learnerId,modNum]=m;

  // Collect ALL eisa fields for this learner+module from the DOM
  const prefix=`${learnerId}_m${modNum}_`;
  const payload={
    tenant_id:TENANT_ID,
    learner_id:+learnerId,
    programme_id:activeProgramme.id,
    module_number:+modNum,
  };
  document.querySelectorAll(`[data-eisa^="${prefix}"]`).forEach(el=>{
    const field=el.dataset.eisa.slice(prefix.length);
    // Map field names to DB column names
    const colMap={
      km:'km_result',pm:'pm_result',wm:'wm_result',
      examv1:'exam_v1_result',examv2:'exam_v2_result',
      examv1_pct:'exam_v1_pct',examv2_pct:'exam_v2_pct',
    };
    const col=colMap[field];
    if(col)payload[col]=el.value||null;
  });
  sbUpsert('eisa',payload).catch(e=>console.warn('EISA sync failed:',e.message));
}

function syncResult(sel){
  // Update print span sibling
  const printSpan=sel.nextElementSibling;
  if(printSpan&&printSpan.classList.contains('result-print')){
    const v=sel.value;
    printSpan.className='result-print badge '+(v==='C'?'badge-c':v==='NYC'?'badge-nyc':'badge-na');
    printSpan.textContent=v||'—';
  }
  syncEisaToSupabase(sel);
  autoSave();
}
function syncSurveyComment(ta){
  const key=ta.dataset.surveyComment;
  const el=document.querySelector(`[data-survey-comment-print="${key}"]`);
  if(el)el.textContent=ta.value;
  autoSave();
}
function syncExamPct(inp){
  // Resolve the matching print span via data-eisa-print (same key as the select's data-eisa)
  const screenWrap=inp.closest('.exam-screen');
  const sel=screenWrap?.querySelector('select');
  if(sel){
    const key=sel.dataset.eisa;
    const printSpan=document.querySelector(`[data-eisa-print="${key}"]`);
    if(printSpan){
      const v=sel.value;
      const p=inp.value;
      const bc=v==='C'?'badge-c':v==='NYC'?'badge-nyc':'badge-na';
      printSpan.className='result-print badge '+(v?bc:'badge-na');
      printSpan.textContent=v?(p?v+' / '+p+'%':v):'—';
    }
    syncEisaToSupabase(sel);
  }
  autoSave();
}

async function saveModDates(inp){
  const field=inp.dataset.modField;
  const val=inp.value.trim();
  if(!activeProgramme||!field)return;
  // Sync print sibling
  const printDiv=inp.nextElementSibling;
  if(printDiv&&printDiv.classList.contains('mod-dates-print'))
    printDiv.textContent=val||'—';
  // Update local state
  activeProgramme[field]=val;
  // Update programmes array
  const idx=programmes.findIndex(p=>p.id===activeProgramme.id);
  if(idx>-1)programmes[idx]=activeProgramme;
  saveSnapshot({clients,programmes,assessors,learners,enrolments,attendance,eisa});
  // PATCH Supabase
  if(isOnline){
    try{
      await sbPatch('programmes',activeProgramme.id,{[field]:val});
      showSaved();
    }catch(e){
      // Silent fail — local state already updated
      console.warn('Module dates patch failed:',e.message);
    }
  } else {
    showSaved();
  }
}

// ── Supabase write helpers ──
async function sbPost(table,body){
  const r=await fetch(`${SB_URL}/rest/v1/${table}`,{
    method:'POST',
    headers:{...HEADERS,'Prefer':'return=representation'},
    body:JSON.stringify(body)
  });
  if(!r.ok)throw new Error(await r.text());
  const d=await r.json();
  return Array.isArray(d)?d[0]:d;
}
async function sbPatch(table,id,body){
  const r=await fetch(`${SB_URL}/rest/v1/${table}?id=eq.${id}`,{
    method:'PATCH',
    headers:{...HEADERS,'Prefer':'return=representation'},
    body:JSON.stringify(body)
  });
  if(!r.ok)throw new Error(await r.text());
  const d=await r.json();
  return Array.isArray(d)?d[0]:d;
}

// ── Upsert: POST with Prefer: resolution=merge-duplicates ──
// Requires a UNIQUE constraint on the conflict key columns in Supabase.
async function sbUpsert(table,body){
  const r=await fetch(`${SB_URL}/rest/v1/${table}`,{
    method:'POST',
    headers:{...HEADERS,'Prefer':'return=representation,resolution=merge-duplicates'},
    body:JSON.stringify(body)
  });
  if(!r.ok)throw new Error(await r.text());
  const d=await r.json();
  return Array.isArray(d)?d[0]:d;
}

async function removeLearner(lid){
  if(!confirm('Remove this learner from the programme?'))return;
  // Remove enrolment
  enrolments=enrolments.filter(e=>!(String(e.learner_id)===String(lid)&&e.programme_id===activeProgramme.id));
  // Remove from learners array (local only — learner may be enrolled in other programmes)
  learners=learners.filter(l=>String(l.id)!==String(lid));
  if(isOnline){
    try{await fetch(`${SB_URL}/rest/v1/enrolments?tenant_id=eq.${TENANT_ID}&learner_id=eq.${lid}&programme_id=eq.${activeProgramme.id}`,{method:'DELETE',headers:HEADERS});}catch{}
  }

async function saveModal(){
  const btn=document.getElementById('modal-save-btn');
  btn.disabled=true;btn.textContent='Saving…';
  const errEl=document.getElementById('modal-err');
  errEl.classList.remove('show');

  try{
    // ── Save learner ──
    if(modalType==='learner'){
      const fn=mval('mf-first_name'),ln=mval('mf-last_name');
      if(!fn||!ln){modalErr('First Name and Surname are required.');btn.disabled=false;btn.textContent=btn.dataset.learnerId?'Save Changes':'Add Learner';return;}
      const idn=mval('mf-id_number');
      const payload={tenant_id:TENANT_ID,first_name:fn,last_name:ln,id_number:idn||null};
      const lid=btn.dataset.learnerId;
      let saved;
      if(lid){
        // Edit
        saved=isOnline?await sbPatch('learners',lid,payload):{...payload,id:lid};
        const idx=learners.findIndex(l=>String(l.id)===String(lid));
        if(idx>-1)learners[idx]={...learners[idx],...payload};
      } else {
        // Add
        saved=isOnline?await sbPost('learners',payload):{...payload,id:Date.now()+Math.random()};
        if(!learners.find(l=>l.id===saved.id))learners.push(saved);
        // Enrol in current programme
        const enr=isOnline
          ?await sbPost('enrolments',{learner_id:saved.id,programme_id:activeProgramme.id,status:'active'})
          :{id:Date.now()+Math.random(),learner_id:saved.id,programme_id:activeProgramme.id,status:'active'};
        enrolments.push(enr);
      }
      saveSnapshot({clients,programmes,assessors,learners,enrolments,attendance,eisa});
      closeModal();showSaved();
      // Reopen list
      openModal('learners','list');
      return;
    }

    if(modalType==='client'){
      const name=mval('mf-client_name');
      if(!name){modalErr('Client Name is required.');btn.disabled=false;btn.textContent=modalMode==='edit'?'Save Changes':'Add';return;}
      const payload={
        tenant_id:TENANT_ID,
        client_name:name,
        contact_person:mval('mf-contact_person')||null,
        contact_number:mval('mf-contact_number')||null,
        contact_email:mval('mf-contact_email')||null,
      };
      let saved;
      if(isOnline){
        saved=modalMode==='edit'
          ?await sbPatch('clients',activeClient.id,payload)
          :await sbPost('clients',payload);
      } else {
        // Offline: mutate local array
        if(modalMode==='edit'){
          Object.assign(activeClient,payload);saved=activeClient;
        } else {
          saved={...payload,id:Date.now()};clients.push(saved);
        }
      }
      // Refresh local array
      if(modalMode==='edit'){
        const idx=clients.findIndex(c=>c.id===saved.id);
        if(idx>-1)clients[idx]=saved;
        activeClient=saved;
      } else {
        if(!clients.find(c=>c.id===saved.id))clients.push(saved);
      }
      // Rebuild dropdown, select new record
      const sel=document.getElementById('sel-client');
      sel.innerHTML='<option value="">— Select client —</option>';
      clients.forEach(c=>{
        const o=document.createElement('option');
        o.value=c.id;o.textContent=c.client_name;
        sel.appendChild(o);
      });
      sel.value=saved.id;
      onClientChange();

    } else {
      // Programme
      const name=mval('mf-programme_name');
      const saqa=mval('mf-saqa_id');
      if(!name||!saqa){modalErr('Programme Name and SAQA ID are required.');btn.disabled=false;btn.textContent=modalMode==='edit'?'Save Changes':'Add';return;}
      const fid=document.getElementById('mf-facilitator_id')?.value;
      const gs=document.getElementById('mf-group_size')?.value;
      const payload={
        tenant_id:TENANT_ID,
        client_id:activeClient.id,
        programme_name:name,
        saqa_id:saqa,
        qualification_code:mval('mf-qualification_code')||null,
        facilitator_id:fid?+fid:null,
        group_name:mval('mf-group_name')||null,
        group_size:gs?+gs:null,
        module_1_dates:mval('mf-module_1_dates')||null,
        module_2_dates:mval('mf-module_2_dates')||null,
        module_3_dates:mval('mf-module_3_dates')||null,
        module_4_dates:mval('mf-module_4_dates')||null,
      };
      let saved;
      if(isOnline){
        saved=modalMode==='edit'
          ?await sbPatch('programmes',activeProgramme.id,payload)
          :await sbPost('programmes',payload);
      } else {
        if(modalMode==='edit'){
          Object.assign(activeProgramme,payload);saved=activeProgramme;
        } else {
          saved={...payload,id:Date.now()};programmes.push(saved);
        }
      }
      if(modalMode==='edit'){
        const idx=programmes.findIndex(p=>p.id===saved.id);
        if(idx>-1)programmes[idx]=saved;
        activeProgramme=saved;
      } else {
        if(!programmes.find(p=>p.id===saved.id))programmes.push(saved);
      }
      // Rebuild programme dropdown for current client
      const sel=document.getElementById('sel-programme');
      sel.innerHTML='<option value="">— Select programme —</option>';
      programmes.filter(p=>p.client_id===activeClient.id).forEach(p=>{
        const o=document.createElement('option');
        o.value=p.id;o.textContent=p.programme_name;
        sel.appendChild(o);
      });
      sel.value=saved.id;
      onProgrammeChange();
    }

    saveSnapshot({clients,programmes,assessors,learners,enrolments,attendance,eisa});
    closeModal();
    showSaved();

  }catch(err){
    modalErr('Save failed: '+err.message);
    btn.disabled=false;
    btn.textContent=modalMode==='edit'?'Save Changes':'Add';
  }
}

let importData=null;

function norm(s){return(s||'').toString().trim();}

// Fuzzy column finder — returns index of first matching alias, -1 if none
function colKey(headers,names){
  const lh=headers.map(h=>(h||'').toString().toLowerCase().trim());
  for(const n of names){
    const i=lh.findIndex(h=>h===n.toLowerCase()||h.includes(n.toLowerCase()));
    if(i>-1)return i;
  }
  return -1;
}

// Extract a value from a row by fuzzy column match
function pick(row,headers,names){
  const i=colKey(headers,names);
  return i>=0?norm(row[i]):'';
}

// Scan one sheet and return {programmes[], learners[]}
function scanSheet(sheetName,rows){
  if(rows.length<2)return{programmes:[],learners:[]};

  // Find header row — first row that has 3+ non-empty string cells
  let headerIdx=0;
  for(let i=0;i<Math.min(5,rows.length);i++){
    if(rows[i].filter(c=>c&&typeof c==='string').length>=3){headerIdx=i;break;}
  }
  const headers=rows[headerIdx].map(h=>(h||'').toString());
  const dataRows=rows.slice(headerIdx+1).filter(r=>r.some(c=>norm(c)!==''));
  if(!dataRows.length)return{programmes:[],learners:[]};

  const programmes=[];
  const learners=[];
  const progSeen=new Set();
  const learnerSeen=new Set();

  // Detect sheet intent — if it has first/last name columns it's learner-primary
  const hasFirstName=colKey(headers,['first name','firstname'])>=0;
  const hasLastName=colKey(headers,['last name','lastname','surname'])>=0;
  const hasNationalId=colKey(headers,['national id','id number','id no','sa id'])>=0;
  const isLearnerSheet=hasFirstName||hasLastName||hasNationalId;

  // Detect programme-definition columns
  const hasSaqa=colKey(headers,['saqa id','saqa','saqa no'])>=0;
  const hasClient=colKey(headers,['client','company','organisation','organization','entity','employer'])>=0;
  const isProgSheet=hasSaqa||hasClient;

  dataRows.forEach(row=>{
    // ── Programme fields (only extract full programme if this looks like a prog sheet) ──
    const progName = pick(row,headers,['qualification','programme name','program name','programme','program','course','learnership']);
    const saqaId   = pick(row,headers,['saqa id','saqa','saqa no','saqa number']);
    const clientName=pick(row,headers,['client','company','organisation','organization','entity','employer']);
    const qualCode = pick(row,headers,['qcto code','qualification code','qual code','qcto']);
    const facilitator=pick(row,headers,['facilitator','trainer','knowledge facilitator','facilitator name']);
    const assessor = pick(row,headers,['assessor','assessor name']);
    const groupSize= pick(row,headers,['learners','group size','no of learners','number of learners','delegates','headcount']);
    const cohort   = pick(row,headers,['cohort','group name','group','batch']);
    const startDate= pick(row,headers,['start date','commencement date','start']);
    const endDate  = pick(row,headers,['end date','completion date','end']);
    const pm       = pick(row,headers,['project manager','pm','account manager','contact person']);
    const status   = pick(row,headers,['status','programme status']);

    // ── Learner fields ──
    const firstName= pick(row,headers,['first name','firstname','first']);
    const lastName = pick(row,headers,['last name','lastname','surname','family name']);
    const idNumber = pick(row,headers,['national id','id number','id no','sa id','id','national id number']);
    const email    = pick(row,headers,['email','email address','learner email']);
    const phone    = pick(row,headers,['phone','cell','mobile','contact number','telephone']);
    // Link key — what programme does this learner belong to
    const learnerProgLink=pick(row,headers,['programme name','program name','qualification','programme','program','course']);

    // Only create programme records from programme-definition sheets
    if(isProgSheet&&!isLearnerSheet){
      const progKey=`${clientName}||${saqaId||progName}`;
      if((progName||saqaId)&&!progSeen.has(progKey)){
        progSeen.add(progKey);
        const mod1Dates=startDate&&endDate?`${startDate} – ${endDate}`:startDate||'';
        programmes.push({
          _sheet:sheetName,
          client_name:clientName,
          programme_name:progName,
          saqa_id:saqaId,
          qualification_code:qualCode,
          facilitator_name:facilitator,
          assessor_name:assessor,
          group_size:groupSize?+groupSize||null:null,
          group_name:cohort,
          module_1_dates:mod1Dates,
          contact_person:pm,
          status,
        });
      }
    }

    // Mixed sheet (has both prog and learner columns) — extract both
    if(isProgSheet&&isLearnerSheet){
      const progKey=`${clientName}||${saqaId||progName}`;
      if((progName||saqaId)&&!progSeen.has(progKey)){
        progSeen.add(progKey);
        const mod1Dates=startDate&&endDate?`${startDate} – ${endDate}`:startDate||'';
        programmes.push({
          _sheet:sheetName,
          client_name:clientName,
          programme_name:progName,
          saqa_id:saqaId,
          qualification_code:qualCode,
          facilitator_name:facilitator,
          group_size:groupSize?+groupSize||null:null,
          group_name:cohort,
          module_1_dates:mod1Dates,
          contact_person:pm,
          status,
        });
      }
    }

    // Learner row — collect from any sheet that has name/ID columns
    const learnerKey=idNumber||(firstName+'||'+lastName);
    if((firstName||lastName||idNumber)&&!learnerSeen.has(learnerKey)){
      learnerSeen.add(learnerKey);
      learners.push({
        _sheet:sheetName,
        _prog_name:learnerProgLink, // link key to match against programme
        first_name:firstName,
        last_name:lastName,
        id_number:idNumber,
        email,phone,
      });
    }
  });

  return{programmes,learners};
}

function previewImport(input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const allProgs=[],allLearners=[];
      const sheetLog=[];

      // Scan every sheet
      wb.SheetNames.forEach(name=>{
        const ws=wb.Sheets[name];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});
        const{programmes,learners}=scanSheet(name,rows);
        allProgs.push(...programmes);
        allLearners.push(...learners);
        if(programmes.length||learners.length){
          sheetLog.push(`<em>${name}</em>: ${programmes.length} programme row${programmes.length!==1?'s':''}, ${learners.length} learner${learners.length!==1?'s':''}`);
        }
      });

      if(!allProgs.length&&!allLearners.length){
        modalErr('Could not find any recognisable data. Check column names match common variations (Client, Qualification, First Name, Surname, National ID etc.)');
        return;
      }

      // Deduplicate programmes by saqa_id+client_name
      const progMap={};
      allProgs.forEach(p=>{
        const key=`${p.client_name}||${p.saqa_id||p.programme_name}`;
        if(!progMap[key])progMap[key]=p;
        else{
          // Merge — fill in blanks from later rows
          const existing=progMap[key];
          Object.keys(p).forEach(k=>{if(!existing[k]&&p[k])existing[k]=p[k];});
        }
      });

      // Deduplicate learners by id_number or name
      const learnerMap={};
      allLearners.forEach(l=>{
        const key=l.id_number||(l.first_name+'||'+l.last_name);
        if(!learnerMap[key])learnerMap[key]=l;
      });

      // Link learners to programmes by programme name or SAQA match
      const progEntries=Object.entries(progMap);
      const linkedLearners=Object.values(learnerMap).map(l=>{
        const lp=(l._prog_name||'').toLowerCase().trim();
        // 1. Exact programme name match
        let match=progEntries.find(([,p])=>
          p.programme_name&&p.programme_name.toLowerCase()===lp);
        // 2. Partial name match
        if(!match)match=progEntries.find(([,p])=>
          p.programme_name&&lp&&(
            p.programme_name.toLowerCase().includes(lp)||
            lp.includes(p.programme_name.toLowerCase())
          ));
        // 3. SAQA ID match
        if(!match)match=progEntries.find(([,p])=>p.saqa_id&&p.saqa_id===l._prog_name);
        // 4. Fallback — assign to first programme
        const pkey=match?match[0]:(progEntries[0]?.[0]||'');
        return{...l,_pkey:pkey};
      });

      importData={progMap,learnerMap:learnerMap,learnerRows:linkedLearners};

      // Per-programme learner counts
      const progLearnerCounts={};
      linkedLearners.forEach(l=>{progLearnerCounts[l._pkey]=(progLearnerCounts[l._pkey]||0)+1;});
      const progLines=Object.entries(progMap).map(([k,p])=>{
        const count=progLearnerCounts[k]||0;
        const name=p.programme_name||p.saqa_id||'Unknown';
        const client=p.client_name?` (${p.client_name})`:'';
        return`<div style="padding-left:12px;color:rgba(255,255,255,.5)">↳ ${esc(name)}${esc(client)} — <strong style="color:#fff">${count}</strong> learner${count!==1?'s':''}</div>`;
      }).join('');

      const nc=new Set(Object.values(progMap).map(p=>p.client_name).filter(Boolean)).size;
      const np=Object.keys(progMap).length;
      const nl=linkedLearners.length;

      // Show what fields were found vs blank
      const sampleProg=Object.values(progMap)[0]||{};
      const found=[
        sampleProg.client_name&&'Client',
        sampleProg.programme_name&&'Programme name',
        sampleProg.saqa_id&&'SAQA ID',
        sampleProg.facilitator_name&&'Facilitator',
        sampleProg.module_1_dates&&'Module dates',
        sampleProg.group_size&&'Group size',
        sampleProg.contact_person&&'Contact person',
      ].filter(Boolean);
      const missing=[
        !sampleProg.client_name&&'Client',
        !sampleProg.programme_name&&'Programme name',
        !sampleProg.saqa_id&&'SAQA ID',
      ].filter(Boolean);

      document.getElementById('import-preview').innerHTML=`
        <div style="background:rgba(255,255,255,.06);border-radius:var(--r);padding:14px 16px;font-size:9pt;color:rgba(255,255,255,.7);line-height:1.9">
          <div style="font-weight:700;color:#fff;margin-bottom:8px">Found across ${wb.SheetNames.length} sheet${wb.SheetNames.length!==1?'s':''}:</div>
          <div>🏢 <strong style="color:#fff">${nc}</strong> client${nc!==1?'s':''}</div>
          <div>📋 <strong style="color:#fff">${np}</strong> programme${np!==1?'s':''}</div>
          ${progLines}
          <div>👤 <strong style="color:#fff">${nl}</strong> learner${nl!==1?'s':''} total</div>
          ${found.length?`<div style="margin-top:8px;color:#6ee7b7">✓ Recognised: ${found.join(', ')}</div>`:''}
          ${missing.length?`<div style="color:var(--gold2)">⚠ Blank (fill in after import): ${missing.join(', ')}</div>`:''}
          <div style="margin-top:8px;font-size:8pt;color:rgba(255,255,255,.35)">${sheetLog.join(' · ')}</div>
        </div>`;
      document.getElementById('modal-save-btn').disabled=false;
      document.getElementById('modal-err')?.classList.remove('show');
    }catch(err){
      modalErr('Could not read file: '+err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

async function confirmImport(){
  if(!importData)return;
  const btn=document.getElementById('modal-save-btn');
  btn.disabled=true;btn.textContent='Importing…';
  const syncDB=document.getElementById('import-sync')?.checked&&isOnline;
  const{progMap,learnerRows}=importData;

  try{
    // ── 1. Clients ──
    const clientNameToId={};
    const allClientNames=[...new Set(Object.values(progMap).map(p=>p.client_name).filter(Boolean))];
    for(const cn of allClientNames){
      let existing=clients.find(c=>c.client_name===cn);
      if(!existing){
        const pd=Object.values(progMap).find(p=>p.client_name===cn)||{};
        const payload={
          tenant_id:TENANT_ID,
          client_name:cn,
          contact_person:pd.contact_person||null,
          contact_number:null,
          contact_email:null,
        };
        existing=syncDB?await sbPost('clients',payload):{...payload,id:Date.now()+Math.random()};
        clients.push(existing);
      }
      clientNameToId[cn]=existing.id;
    }

    // ── 2. Assessors ──
    const facNames=[...new Set(Object.values(progMap).map(p=>p.facilitator_name).filter(Boolean))];
    for(const fn of facNames){
      if(!assessors.find(a=>a.full_name===fn)){
        const a=syncDB
          ?await sbPost('assessors',{tenant_id:TENANT_ID,full_name:fn,role:'Facilitator'})
          :{id:Date.now()+Math.random(),tenant_id:TENANT_ID,full_name:fn,role:'Facilitator'};
        assessors.push(a);
      }
    }

    // ── 3. Programmes ──
    for(const pkey of Object.keys(progMap)){
      const pd=progMap[pkey];
      const cid=clientNameToId[pd.client_name];
      if(!cid&&!pd.programme_name)continue;
      let existing=programmes.find(p=>
        (pd.saqa_id&&p.saqa_id===pd.saqa_id)||
        (pd.programme_name&&p.programme_name===pd.programme_name&&p.client_id===cid)
      );
      if(!existing){
        const fac=assessors.find(a=>a.full_name===pd.facilitator_name);
        const payload={
          tenant_id:TENANT_ID,
          client_id:cid||null,
          programme_name:pd.programme_name||pd.saqa_id||'Imported Programme',
          saqa_id:pd.saqa_id||null,
          qualification_code:pd.qualification_code||null,
          group_name:pd.group_name||null,
          group_size:pd.group_size||null,
          module_1_dates:pd.module_1_dates||null,
          module_2_dates:null,module_3_dates:null,module_4_dates:null,
          facilitator_id:fac?fac.id:null,
        };
        existing=syncDB
          ?await sbPost('programmes',payload)
          :{...payload,id:Date.now()+Math.random()};
        programmes.push(existing);
      }
      progMap[pkey]._id=existing.id;
    }

    // ── 4. Learners + enrolments ──
    for(const lr of learnerRows){
      const pid=progMap[lr._pkey]?._id;
      if(!pid)continue;
      let lrec=learners.find(l=>l.id_number&&l.id_number===lr.id_number)
        ||learners.find(l=>l.first_name===lr.first_name&&l.last_name===lr.last_name);
      if(!lrec){
        const payload={tenant_id:TENANT_ID,first_name:lr.first_name,last_name:lr.last_name,id_number:lr.id_number||null};
        lrec=syncDB
          ?await sbPost('learners',payload)
          :{...payload,id:Date.now()+Math.random()};
        learners.push(lrec);
      }
      if(!enrolments.find(e=>e.learner_id===lrec.id&&e.programme_id===pid)){
        const enr=syncDB
          ?await sbPost('enrolments',{tenant_id:TENANT_ID,learner_id:lrec.id,programme_id:pid,status:'active'})
          :{id:Date.now()+Math.random(),tenant_id:TENANT_ID,learner_id:lrec.id,programme_id:pid,status:'active'};
        enrolments.push(enr);
      }
    }

    saveSnapshot({clients,programmes,assessors,learners,enrolments,attendance,eisa});
    importData=null;

    // Rebuild client dropdown
    const sel=document.getElementById('sel-client');
    sel.innerHTML='<option value="">— Select client —</option>';
    clients.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.client_name;sel.appendChild(o);});
    document.getElementById('loading-state').style.display='none';
    setStatus(true,syncDB?'Imported & saved':'Imported (local only)');
    closeModal();
    showSaved();
  }catch(err){
    modalErr('Import failed: '+err.message);
    btn.disabled=false;btn.textContent='Import';
  }
}

async function saveUs(isEdit){
  const usId=(document.getElementById('us-id')?.value||'').trim();
  const title=(document.getElementById('us-title')?.value||'').trim();
  const mod=+document.getElementById('us-mod')?.value||1;
  const level=+document.getElementById('us-level')?.value||0;
  const credits=+document.getElementById('us-credits')?.value||0;
  if(!usId||!title){modalErr('US ID and Title are required.');return;}
  const saqa_id=activeProgramme.saqa_id||'';
  const payload={
    tenant_id:TENANT_ID,
    saqa_id,
    us_id:usId,
    us_title:title,
    module_number:mod,
    us_level:level||null,
    us_credits:credits||null,
  };
  try{
    let saved;
    if(isOnline){
      if(isEdit&&usEditId){
        saved=await sbPatch('unit_standards',usEditId,payload);
      } else {
        saved=await sbPost('unit_standards',payload);
      }
    } else {
      saved={...payload,id:usEditId||Date.now()};
    }
    // Update local unitStandards array
    const mapped={
      _dbid:saved.id||usEditId,
      mod,id:usId,title,
      level:level||'',credits:credits||0,saqa_id,
    };
    if(isEdit&&usEditId){
      const idx=unitStandards.findIndex(u=>u._dbid===usEditId);
      if(idx>-1)unitStandards[idx]=mapped; else unitStandards.push(mapped);
    } else {
      unitStandards.push(mapped);
    }
    usEditId=null;
    // Show + Add button again, re-render list
    const addBtn=document.querySelector('#modal-body > div:last-child');
    if(addBtn)addBtn.style.display='';
    await renderUsList();
    showSaved();
  }catch(e){
    modalErr('Save failed: '+e.message);
  }
}

  if(!confirm(`Delete "${us.id} — ${us.title}"?`))return;
  if(isOnline&&us._dbid){
    try{
      await fetch(`${SB_URL}/rest/v1/unit_standards?id=eq.${us._dbid}`,{method:'DELETE',headers:HEADERS});
    }catch(e){console.warn('US delete failed:',e.message);}
  }
  unitStandards=unitStandards.filter(u=>!(u._dbid===us._dbid||u.id===us.id&&u.saqa_id===us.saqa_id));
  await renderUsList();
}

const DRAFT_PREFIX='apex_report_';

function getDraftMeta(key){
  // key format: apex_report_{progId}_{month}
  // We store a _meta field inside each draft
  try{
    const d=localStorage.getItem(key);
    if(!d)return null;
    const parsed=JSON.parse(d);
    return parsed._meta||null;
  }catch{return null;}
}

function listDrafts(){
  const drafts=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(!k||!k.startsWith(DRAFT_PREFIX))continue;
    const meta=getDraftMeta(k);
    if(meta)drafts.push({key:k,...meta});
  }
  return drafts.sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));
}

function updateDraftsCount(){
  const drafts=listDrafts();
  const badge=document.getElementById('drafts-count');
  if(!badge)return;
  if(drafts.length>0){
    badge.textContent=drafts.length;
    badge.style.display='inline';
  } else {
    badge.style.display='none';
  }
}

function openDraftsPanel(){
  const drafts=listDrafts();
  const list=document.getElementById('drafts-list');
  if(!drafts.length){
    list.innerHTML=`<div class="drafts-empty">No saved drafts yet.<br>Click <strong>💾 Save Draft</strong> while a report is open.</div>`;
  } else {
    list.innerHTML=drafts.map(d=>`
      <div class="draft-item" onclick="resumeDraft('${d.key}')">
        <div class="draft-client">${esc(d.clientName||'Unknown client')}</div>
        <div class="draft-prog">${esc(d.progName||'Unknown programme')}</div>
        <div class="draft-meta">
          <span class="draft-month">${esc(d.month||'—')}</span>
          <span class="draft-time">${d.savedAt?new Date(d.savedAt).toLocaleString('en-ZA',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—'}</span>
          <button class="draft-delete" title="Delete draft" onclick="deleteDraft(event,'${d.key}')">×</button>
        </div>
      </div>`).join('');
  }
  document.getElementById('drafts-panel').classList.add('open');
  document.getElementById('drafts-overlay').style.display='block';
}

function closeDraftsPanel(){
  document.getElementById('drafts-panel').classList.remove('open');
  document.getElementById('drafts-overlay').style.display='none';
}

function deleteDraft(e,key){
  e.stopPropagation();
  localStorage.removeItem(key);
  updateDraftsCount();
  openDraftsPanel(); // refresh list
}

async function resumeDraft(key){
  closeDraftsPanel();
  const meta=getDraftMeta(key);
  if(!meta)return;
  // Select the right client
  const client=clients.find(c=>c.id===meta.clientId);
  const prog=programmes.find(p=>p.id===meta.progId);
  if(!client||!prog){
    alert('Client or programme no longer found. The data may have been removed.');
    return;
  }
  // Set dropdowns
  const selC=document.getElementById('sel-client');
  selC.value=meta.clientId;
  onClientChange();
  // Wait for programme dropdown to populate
  await new Promise(r=>setTimeout(r,50));
  const selP=document.getElementById('sel-programme');
  selP.value=meta.progId;
  try{
    await onProgrammeChange();
  }catch(e){
    console.warn('resumeDraft: onProgrammeChange failed:',e.message);
  }
  // Set month
  const selM=document.getElementById('sel-month');
  selM.value=meta.month;
  // Generate — narratives will auto-restore via loadNarratives()
  generateReport();
  setStatus(true,`Resumed: ${meta.clientName} · ${meta.month}`);
}

// ── Boot ──
init();
</script>
