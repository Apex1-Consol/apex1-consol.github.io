<style>
:root{--navy:#25247b;--ink:#1f2937;--text:#2d3748;--muted:#5a6577;--line:#e2e8f0;--panel:#f8fafc;--track:#edf2f7;--orange:#e13d18;--gold:#ff6a45;--green:#15803d;--red:#c53030;--amber:#dd6b20;--bg:#eef1f5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:'DM Sans',system-ui,sans-serif;color:var(--text);font-size:15px;line-height:1.5}
.wrap{max-width:980px;margin:24px auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(15,35,64,.08)}
.mono{font-family:'DM Mono',monospace}.tnum{font-variant-numeric:tabular-nums}
header{background:linear-gradient(120deg,#16154f,#25247b 60%,#34339a);position:relative;overflow:hidden;color:#fff;padding:28px 40px}
header h1{margin:18px 0 4px;font-size:36px;line-height:1.15}header h1 span{color:var(--gold)}
.hrow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:flex-start}
.logo{display:flex;align-items:center;height:66px}.logo img{height:62px;width:auto;display:block}
.stamps{text-align:right;font-size:14px;opacity:.92}.stamps b{color:#fff}
.stripe{display:flex;height:6px}.stripe i{flex:7;background:var(--orange)}.stripe s{flex:3;background:#fff}
.noticebar{background:#fff8ec;color:#7b4a12;padding:10px 40px;font-size:14px}
.tag{display:inline-block;border-radius:4px;padding:1px 7px;font:500 12px 'DM Mono',monospace;text-transform:uppercase;color:#fff;vertical-align:middle}
nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;padding:0 28px}
nav button{border:0;background:none;padding:14px 12px;font:600 15px 'DM Sans';color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
nav button[aria-selected=true]{color:var(--navy);border-color:var(--orange)}
nav .b{font:500 12px 'DM Mono';background:var(--track);border-radius:4px;padding:1px 6px;margin-left:6px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:10px 40px;border-bottom:1px solid var(--line);background:#fbfcfd;font-size:14px}
.legend .lab{font:500 12px 'DM Mono';text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.key{display:inline-block;border-radius:4px;padding:1px 7px;font:500 12px 'DM Mono';text-transform:uppercase;color:#fff}
.panel{display:none}.panel.on{display:block}.printonly{display:none}thead{display:table-header-group}tr{break-inside:avoid}
.asof{padding:8px 40px;font-size:13px;color:var(--muted);background:#fbfcfd;border-bottom:1px solid var(--line)}
.sec{padding:28px 40px;border-top:1px solid var(--line)}
.eb{font:500 13px 'DM Mono';text-transform:uppercase;letter-spacing:.12em;color:var(--orange)}
h2{margin:4px 0 14px;font-size:22px;color:var(--ink)}h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.grey{background:var(--panel)}.note{color:var(--muted);font-size:14px;margin-top:10px}
.rowlab{font:500 12px 'DM Mono';text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:16px 0 8px}.rowlab:first-child{margin-top:0}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px 40px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:760px){.g4{grid-template-columns:1fr 1fr}.g2,.g3{grid-template-columns:1fr}.sec,header,.noticebar,.legend,.asof,.strip{padding-left:16px;padding-right:16px}}
.kpi{background:#fff;border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:12px;padding:16px;display:flex;flex-direction:column}
.kpi .k{font-size:26px;font-weight:700;color:var(--ink);line-height:1.15}.kpi .t{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:4px}.kpi .s{font-size:14px;margin-top:auto;padding-top:8px}
button.kpi{text-align:left;cursor:pointer;font:inherit}button.kpi:hover{box-shadow:0 4px 10px rgba(0,0,0,.08)}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 120px 64px;gap:14px;align-items:center;padding:4px 0}
.bar .tr{height:10px;background:var(--track);border:1px solid var(--line);border-radius:9px;overflow:hidden}.bar .tr i{display:block;height:100%;border-radius:9px}
.bar .v{text-align:right;font:500 14px 'DM Mono'}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--line);padding:8px 8px 8px 0}
td{border-bottom:1px solid var(--line);padding:8px 8px 8px 0;vertical-align:top}.scroll{overflow-x:auto}td.r,th.r{text-align:right}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.chip{display:inline-block;border-radius:4px;padding:1px 7px;font-size:13px;font-weight:600}
.ok{background:#edfbf3;color:var(--green)}.bad{background:#fff0f0;color:var(--red)}.warn{background:#fff8ec;color:#a84a00}.neu{background:var(--track);color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:14px}.risk{background:#fff0f0;border-color:#fbd5d5}
.wait{border:2px dashed #cbd5e0;background:var(--panel);border-radius:12px;padding:14px}
.cols{display:flex;align-items:flex-end;gap:8px;height:190px}.cols div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0}
.cols b{font:500 13px 'DM Mono'}.cols i{display:block;width:100%;background:var(--navy);border-radius:5px 5px 0 0}.cols span{font-size:12px;color:var(--muted);white-space:nowrap}
.stack{display:flex;height:14px;border-radius:9px;overflow:hidden;background:var(--track);margin-top:14px}
details{border-top:1px solid var(--line)}details>summary{cursor:pointer;padding:18px 40px;list-style:none;position:relative}details>summary::-webkit-details-marker{display:none}
details>summary h2{margin:2px 0 0;font-size:20px;padding-right:30px}details>summary .sum{color:var(--text);font-size:15px}
details>summary:after{content:'⌄';position:absolute;right:40px;top:22px;color:var(--navy);font-size:20px}details[open]>summary:after{transform:rotate(180deg)}
details>.body{padding:0 40px 28px}
@media(max-width:760px){details>summary,details>.body{padding-left:16px;padding-right:16px}details>summary:after{right:16px}}
.keys{margin-top:6px;display:flex;gap:8px;flex-wrap:wrap}
.todo{margin-top:20px;border:1px solid var(--line);border-radius:12px;background:#fbfcfd}
.todo .hd{font:500 12px 'DM Mono';text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:8px 14px;border-bottom:1px solid var(--line)}
.todo li{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:flex-start;padding:10px 14px;border-bottom:1px solid var(--line)}.todo li:last-child{border-bottom:0}
.todo ul{list-style:none;margin:0;padding:0}.todo .tx{flex:1;min-width:60%;color:var(--ink)}.todo .ow{color:var(--muted);font-size:14px}
.idc{font:500 13px 'DM Mono';color:var(--navy)}a{color:var(--navy)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font:600 14px 'DM Sans';color:var(--navy);cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{border:0;border-right:1px solid var(--line);background:#fff;padding:6px 12px;font:600 14px 'DM Sans';color:var(--text);cursor:pointer}.seg button:last-child{border-right:0}.seg button.on{background:var(--navy);color:#fff}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
input,select{font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff}
.na{background:#fff0f0;color:var(--red);border-radius:4px;padding:0 6px;font-size:13px;white-space:nowrap}
.strip{display:flex;flex-wrap:wrap;gap:6px 24px;padding:12px 40px;border-bottom:1px solid var(--line);font-size:15px}
.switch[hidden]{display:none!important}.switch{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 40px;border-bottom:1px solid var(--line);background:#fff}.switch .lab{font:500 12px 'DM Mono';text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
#alt{display:none}body.alt #alt{display:block}body.alt #orig{display:none}
.hero h1{font-size:28px;line-height:1.2;margin:6px 0 8px;color:var(--ink)}.lead{font-size:17px;max-width:70ch;margin:0 0 18px}
.big{border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:12px;padding:16px;background:#fff}.big .n{font-size:36px;font-weight:700;color:var(--ink);line-height:1}.big .l{font-size:14px;color:var(--muted);margin-top:4px}.big p{margin:8px 0 6px;font-size:14px}.big a{font-weight:600;font-size:14px}
.dots{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 30px}.dots div{display:flex;align-items:center;gap:4px;font-size:14px;padding:4px 0;border-bottom:1px solid var(--line)}.dots span:nth-child(2){flex:1}
@media(max-width:760px){.dots{grid-template-columns:1fr}.switch{padding-left:16px;padding-right:16px}}
.qhead{border-left:5px solid var(--navy);background:var(--panel);padding:18px 22px;margin:24px 40px 6px;border-radius:0 12px 12px 0}.qhead h2{margin:0 0 10px}.qhead .qn{font-size:30px;font-weight:700;color:var(--ink);line-height:1}.qhead .l{font-size:13px;color:var(--muted)}.qhead p{margin:10px 0 0}
.quiet{color:var(--muted);font-size:14px}.quiet details,.quiet .sec{color:var(--text)}
body.vC #alt .todo:not(.sec .todo:first-of-type){}body.vC #alt details .todo,body.vC #alt .sec[id] .todo{display:none}
@media print{body.alt #orig{display:none!important}.switch{display:none!important}}
.xgw{margin:16px 40px 0!important}@media(max-width:760px){.xgw{margin:12px 16px 0!important}}.xg{background:#f3f3fb;border:1px solid #dcdcf0;border-left:4px solid var(--navy);border-radius:10px;padding:10px 16px;margin:6px 0 16px}.xh{font:500 12px 'DM Mono';text-transform:uppercase;letter-spacing:.1em;color:var(--navy);margin-bottom:4px}.xg ul{margin:0;padding-left:18px}.xg li{margin:3px 0;font-size:15px}.xg b{color:var(--ink)}
body.noguide .xg,body.noguide #howread{display:none}
.hr{margin:0;padding-left:18px}.hr li{margin:6px 0}.gl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0;font-size:15px}.gl dt{font-weight:700;color:var(--navy)}.gl dd{margin:0}
@media print{.xg{break-inside:avoid}}
#legend{display:none!important}footer{background:#16154f;align-items:center;color:rgba(255,255,255,.85);padding:16px 40px;font-size:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
@media print{body{background:#fff}.wrap{box-shadow:none;margin:0;max-width:none;border-radius:0}nav,.np{display:none!important}.panel{display:block!important;break-before:page}.panel:first-of-type{break-before:auto}details>summary:after{display:none}details{break-inside:auto}.printonly{display:block}.screenonly{display:none}}
</style>

function viewB(){return `<div class="sec hero"><div class="eb">Snapshot ${D.jobRun}</div><h1>Three questions</h1><p class="lead">${Q.map(x=>`<a href="#" onclick="openSec('q-${Q.indexOf(x)}');return false">${x.q}</a>`).join(' · ')}</p></div>${Q.map((x,i)=>`<div id="q-${i}" class="qwrap">${qBlock(x)}</div>`).join('')}${emptyLine}${howWeCount}`}
const ROLES=[
 {r:'Management',own:['Management'],nums:[[S.new,'waiting'],[openHigh,'high-risk flags'],[SCN('red'),`of ${SC.length} targets off`]],say:'Decide the targets, who owns the queue, and the re-application policy.',secs:[T_BRIEF,'Performance against targets',T_TOP,'What management needs to decide',T_TREND,'Not reportable yet']},
 {r:'Screening team',own:['Screening team'],nums:[[S.new,'to review'],[D.over30,'over 30 days'],[openHigh,'high-risk flags']],say:`Work the queue oldest first and clear the ${openHigh} high-risk flags before placing anyone.`,secs:['Review queue, oldest first','Candidates by stage','Integrity Flags list','Why people applied more than once','Disability evidence','Can we reach them?','Age and eligibility checks','What the Additional Comments say']},
 {r:'BDMs',own:['BDMs','Marketing'],nums:[[S.validated,'ready to place'],[maxWait+' d','longest wait'],[regAssigned,'with a client or programme']],say:`${waitLong.length} validated candidates need a seat now.`,secs:['Ready to recruit','Learners by client and programme','Every learner: client and programme','Exits by client and programme','Who applies, and from where','Channel trend by month']},
 {r:'Data owner',own:['Roy','Stavros'],nums:[[D.cleanUp.length,'quick fixes'],[`${exR}/${S.exited}`,'exits with a reason'],[fillOf('Employment status')+'%','employment captured']],say:'Fill the empty fields so the hidden sections can be reported.',secs:['Clean-up list','Field completeness','Form-fix tracker','Exit record completeness','Every exited record','Evidence matrix','Sensitive checks (private function)']}];
let role=0;
function viewC(){const x=ROLES[role];const acts=x.secs.flatMap(t=>(ACT[t]||[]).filter(a=>x.own.includes(a[2])));
 return `<div class="sec hero"><div class="eb">View for</div><div class="seg np" style="margin:6px 0 14px">${ROLES.map((y,i)=>`<button class="${i===role?'on':''}" onclick="role=${i};show('C')">${y.r}</button>`).join('')}</div>
 <div class="qhead" style="border-left-color:var(--navy);margin:0"><h2>${x.r}</h2><div class="g3">${x.nums.map(n=>`<div><div class="qn tnum">${n[0]}</div><div class="l">${n[1]}</div></div>`).join('')}</div><p>${x.say}</p></div>
 ${acts.length?`<div class="todo"><div class="hd">Your actions (${acts.length})</div><ul>${acts.map(a=>`<li>${keyTag(a[0])}<span class="tx">${a[1]}</span><span class="ow">${a[2]}</span></li>`).join('')}</ul></div>`:''}</div>${slots(x.secs)}`}
const VIEWS=[['A','A · One page'],['B','B · Three questions'],['C','C · By role'],['T','v3.1 tabs']];
function show(v){restore();document.body.className=v==='T'?'':'alt v'+v;const alt=document.getElementById('alt');alt.innerHTML=v==='A'?viewA():v==='B'?viewB():v==='C'?viewC():'';fillSlots();
 document.getElementById('switch').innerHTML=`<span class="lab">Layout</span><span class="seg">${VIEWS.map(w=>`<button class="${w[0]===v?'on':''}" onclick="show('${w[0]}')">${w[1]}</button>`).join('')}</span><span class="note" style="margin:0">Same data and sections in every layout.</span>`;window.scrollTo({top:0})}
show('T');
/* ============ v3.4 reading guides: 3 bullets per section, numbers from D ============ */
const pctOf=(a,b)=>b?Math.round(a/b*1000)/10+'%':'0%';
const webN=(D.sources.find(s=>s[0]==='ApexU Website')||[0,0])[1];
const XG={'#at-a-glance':['The headline numbers for applications, recruitment, exits and learner placement.','Each box is one count; the small line under it gives context.',`${S.new} of ${D.records} applications (${pctOf(S.new,D.records)}) are still awaiting review.`],
 [T_BRIEF]:['The whole pipeline in one line: how many are waiting, how many have been decided, and how many are placed.',`Read left to right as the candidate's journey: apply → reviewed (${reviewed}) → recruited (${S.recruited}).`,`${S.new} of ${D.records} records (${pctOf(S.new,D.records)}) have not been looked at yet.`],
 'Not reportable yet':['Sections that exist in the design but have no data behind them yet.','Each item is a ClickUp field that is still empty for every record.','Once someone starts filling these fields, the sections appear on their own. No rebuild needed.'],
 'Performance against targets':['Each row is one measure with a proposed target.','Dot colour: green = target met, amber = within 10% of target, red = further off, grey = no data yet.',`${SCN('red')} of ${SC.length} are red. Targets are proposals until management confirms them.`],
 [T_TOP]:['The few problems that most affect whether the numbers can be trusted or people get placed.','Each row has a named owner. Click the risk to jump to its detail.','Each row is tracked as a ClickUp task with a due date.'],
 'What management needs to decide':['Questions only management can answer. The report cannot settle them from data.','Each one blocks a target or a process from being set.','Until decided, the related measures stay "proposed".'],
 [T_TREND]:['This week compared with the previous snapshot.',`Arrows show the direction; the number in brackets is last week's value.`,'Use it to see if things are getting better or worse, not for absolute totals.'],
 'Weekly intake':['How many applications arrived each week (weeks start Monday).','The orange bar is the busiest week. The latest week may still be in progress.','Spikes usually follow a campaign or a post. Plan screening capacity around them.'],
 'Candidates by stage':['Where every record sits right now in ClickUp.',`"New submissions" means nobody has reviewed it yet (${S.new}).`,`Only ${reviewed} have been reviewed, so most of the pipeline is still unknown.`],
 'Review queue, oldest first':['How long applications have been waiting for a first review.',`The coloured boxes group the wait into bands; the table lists the oldest record IDs first.`,`${D.over30} have waited over 30 days. At ${D.reviewRate} a day the queue takes about ${reviewDays} working days to clear.`],
 'Who applies, and from where':['Gender, disability and the channel candidates say they heard about us from.','Percentages are of all records, including repeats.',`The ApexU Website brings ${pctOf(webN,D.records)} of applications, so the website form matters most.`],
 'Channel trend by month':['Each channel\'s applications by month.','Read across a row to see if a channel is rising, falling or steady.','Shows where to spend recruitment effort next.'],
 'Age profile':['How old applicants are, in age bands.',`The median (middle) age is ${D.ageMedian}.`,'Learnerships target youth (18–35); anyone outside that range needs checking.'],
 'Race and disability':['Equity mix of applicants, for B-BBEE and funder reporting.','Bars are a share of all records. Marked "internal": not for outside sharing at this level.',`Persons with disability are ${pctOf(D.dis.PwD,D.records)} of intake and able-bodied applicants ${pctOf(D.dis.AB,D.records)}; programmes have seats for both, so both pools matter.`],
 'Education, documents and schools':['Highest school level, tertiary study, uploaded documents and the most common schools.','Green bars = every record has it; amber = some are missing.','Missing documents stop a candidate from being placed.'],
 'What the Additional Comments say':['Themes from the free-text comments box, paraphrased (never quoted).','Counts show how many comments fall in each theme.','Some comments need a human reply, e.g. health or prior-learnership mentions.'],
 'Ownership and stage timing':['Whether applications are assigned to someone, and how long stages take.','Zero assigned means nobody is accountable for the queue.','Assigning owners is the quickest fix for the waiting time.'],
 'Field completeness':['How often each form field is actually filled in.','100% is good; low numbers usually mean the form is not saving that field.',`Employment status is ${fillOf('Employment status')}% filled, so unemployment cannot be proven from ClickUp yet.`],
 'Form-fix tracker':['Week by week, whether form fixes are working on new applications.','Watch the newest week: it shows if the fix took.','Proves a fix worked before anyone cleans up old records.'],
 'Clean-up list':['Small, specific data fixes, each with a count.','The big number is how many records it affects; the arrow says what to do.','Quick wins that make every other number more reliable.'],
 'Ready to recruit':['Candidates already approved (validated) who are waiting for a placement.','"Waiting" counts days since they were approved.',`${waitLong.length} have waited over 30 days (longest ${maxWait}). Long waits risk losing them.`],
 'Learners by client and programme':['Which client and programme each candidate is linked to.','Bars count records per client or programme. Blank means not linked yet.','Shows which clients are being served and where seats are filling.'],
 'Every learner: client and programme':['The full list, record IDs only, with client and programme.','Use the filter buttons to show only linked or unlinked records. Click an ID to open it in ClickUp.','Use it to check individual records, not for headline numbers.'],
 'Exit record completeness':['Whether each exit has its date, reason and BDM filled in.','Each tick is one required field; the count shows how many exits have it.',`${exR} of ${S.exited} exits have a reason, so we cannot yet say why people leave.`],
 'Exits by client and programme':['Where exits happened.','Bars count exits per client or programme.','Repeated exits at one client may point to a placement problem.'],
 'When they applied':['When the people who later exited first applied.','Bars group exits by application date.','Shows whether a particular intake had more drop-outs.'],
 'Exits vs intake':['Compares who exited with who applied, by gender and by disability (PwD and able bodied).','If an exit bar is much longer than its intake bar, that group leaves more often.','No conclusions until exit reasons are captured.'],
 'Every exited record':['Each exited record ID with its details.','Blank cells are fields not filled in ClickUp.','The working list for completing exit records.'],
 'Why people applied more than once':['Groups of records that look like the same person applying again.',`${CL.length} people account for ${repeats} extra records; the real number of people is ${unique}.`,'Repeats inflate the numbers and can hide changed answers (age, disability).'],
 'Integrity Flags list':['Every record that needs a human check, with a risk level.','High = could affect eligibility or funding; fix those first.',`${openHigh} high-risk flags are open.`],
 'Sensitive checks (private function)':['Checks that use ID numbers, run privately so numbers are never shown.','Results are pass/fail only.','Catches the same ID used twice, or someone who was already funded.'],
 'Can we reach them?':['Whether emails and phone numbers look real and usable.','"Valid" means a proper email and an SA mobile number.','Candidates we cannot contact cannot be placed.'],
 'Age and eligibility checks':['Records where age or completion year does not make sense.','Each row says what looks wrong (e.g. age typed as a birth year).','Wrong ages can make someone look eligible when they are not.'],
 'Disability evidence':['Whether disability status matches the uploaded letter.',`A mismatch is PwD without a letter (${DE.pwdWithoutLetter}) or able-bodied with one (${DE.ableBodiedWithLetter}).`,'Funders can reject claims where evidence does not match.'],
 'Controls to add':['Form and process changes that stop these problems at the source.','Each line is one control to switch on.','Cheaper than cleaning the same problems every month.'],
 'Evidence matrix':['What an auditor (SETA, QCTO, funder) would ask for, and whether we have it.','Green = held, amber = partly, red = missing.','Red rows are the gaps to close before an audit.'],
 'All proposed targets':['The full list of targets and why each was chosen.','"Higher" means more is better; "lower" means less is better.','Management confirms or changes these.'],
 'How these numbers are calculated':['Definitions and rules behind every figure.','Look here if a number seems surprising.','Keeps everyone counting the same way.'],
 'Data sources':['Which data pull each figure comes from, with its time.','Different pulls can differ by a few records.','Explains small differences between sections.'],
 'Data handling':['How personal data is protected in this report.','Only record IDs appear; names and ID numbers stay in ClickUp.','Keeps the report safe to share internally.']
};
const guide=t=>{const b=XG[t];return b?`<div class="xg"><div class="xh">ⓘ Reading guide</div><ul><li><b>What it shows:</b> ${b[0]}</li><li><b>How to read it:</b> ${b[1]}</li><li><b>Why it matters:</b> ${b[2]}</li></ul></div>`:''};
const GLOSS=[['Record','One application in ClickUp. One person can have several records.'],['New submission','An application nobody has reviewed yet.'],['Validated','Reviewed and approved, ready to place with a client.'],['Unsuitable','Reviewed and not accepted.'],['Exited','Was placed or in process and has left.'],['PwD','Person with a disability.'],['Able bodied','A person without a disability.'],['Snapshot','The moment the data was copied from ClickUp. Numbers do not change after that.']];

Object.assign(XG,{
 'Onboarding checklist':['The four onboarding items each recruited learner must complete: '+D.onboardingItems.join(', ')+'.','Each item shows how many recruits have it ticked in ClickUp.',`${D.onboardingTicked} ticked so far. Funders and SETAs ask for proof of all four before a learner starts.`],
 'BDM placements':['How many learners each BDM (business development manager) has placed.','One bar per BDM; it fills once the BDM field and Recruited Date are captured.',`${D.bdmFilled} records have a BDM yet. Shows who is converting candidates into placements.`],
 'Recruited demographics':['Gender, race and disability of the people actually recruited.','Compare these with the Applications tab: the mix should look similar.','Placements, not applications, are what count for B-BBEE and funder targets.'],
 'Why candidates exit':['The reasons learners leave the programme, from the Exit Reason field.','One bar per reason (e.g. found a job, relocation, non-attendance).',`${exR} of ${S.exited} exits have a reason recorded, so this fills as reasons are captured.`],
 'Exits by BDM':['Exits grouped by the BDM who placed the learner.','One bar per BDM; read it alongside BDM placements.','A high share of exits for one BDM may point to poor matching with clients.'],
 'Replacements and time on programme':['Whether exited learners were replaced, and how long they stayed before leaving.','"Replaced" counts exits with a replacement linked; time is Programme Start to Exit Date.','Seats left empty after an exit can cost funding.'],
 'Seats filled per programme':['How many seats each programme has against how many are filled.','Each bar is one programme: filled versus available seats.','Shows where more candidates are needed and where a programme is full.']
});
const BG={
 'p-applicants:strip':['What came in during the last 24 hours.','"+" numbers are new since yesterday\'s snapshot.','A quick daily pulse; check that the form is still working.'],
 'p-applicants:tiles':['Headline counts for applications: intake, pipeline and applicant profile.',`"Unique applicants" removes people who applied more than once (${repeats} repeat applications).`,'These are the totals the rest of this tab breaks down.'],
 'p-recruited:tiles':['Headline counts for recruitment: who is recruited, who is ready, and how fast.','A dash or "needs" means the field behind it is not filled in ClickUp yet.',`${S.validated} candidates are approved and waiting; ${S.recruited} are recorded as recruited.`],
 'p-risks:tiles':['Headline counts of records that need a human check.','Red boxes are high risk: they can change who is eligible or what gets reported to funders.',`${openHigh} high-risk flags are open; fix these before placing anyone.`],
 'p-exited:note':['A note on how the exit records were created.','Read this before the numbers below: it explains why some exit dates are unknown.','Stops readers drawing conclusions from incomplete exit dates.'],
 'p-exited:tiles':['Headline counts for exits.',`"Best record" shows how complete the most complete exit is (fields filled out of ${D.exitFieldsOther.length+2}).`,'Exits only become useful for decisions once dates and reasons are captured.']
};
function addBlockGuides(){
 const put=(el,k,before)=>{if(!el||!BG[k]||el.dataset.g)return;el.dataset.g=1;const b=BG[k];const h=`<div class="xg${before?' xgw':''}"><div class="xh">ⓘ Reading guide</div><ul><li><b>What it shows:</b> ${b[0]}</li><li><b>How to read it:</b> ${b[1]}</li><li><b>Why it matters:</b> ${b[2]}</li></ul></div>`;before?el.insertAdjacentHTML('beforebegin',h):el.insertAdjacentHTML('afterbegin',h)};
 const blocks=id=>[...document.getElementById(id).children].filter(c=>c.tagName==='DIV'&&!c.classList.contains('asof')&&!c.classList.contains('xg'));
 const a=blocks('p-applicants');put(a.find(c=>c.classList.contains('strip')),'p-applicants:strip',true);put(a.find(c=>c.classList.contains('sec')),'p-applicants:tiles');
 put(blocks('p-recruited')[0],'p-recruited:tiles');
 const rk=blocks('p-risks').filter(c=>!c.id);put(rk[0],'p-risks:tiles');
 const e=blocks('p-exited');put(e[0],'p-exited:note');put(e[1],'p-exited:tiles');
}
function addGuides(){
 document.querySelectorAll('#orig details[id], #orig .sec[id]').forEach(el=>{if(el.querySelector(':scope .xg'))return;const h=el.querySelector(':scope > summary h2, :scope > h2');if(!h)return;const g=guide(h.textContent)||guide('#'+el.id);if(!g)return;
  const host=el.tagName==='DETAILS'?el.querySelector(':scope > .body'):h;if(!host)return;
  if(el.tagName==='DETAILS')host.insertAdjacentHTML('afterbegin',g);else{const n=el.querySelector(':scope > .sum')||h;n.insertAdjacentHTML('afterend',g)}});
 const sum=document.getElementById('p-overview');
 if(sum&&!document.getElementById('howread'))sum.insertAdjacentHTML('afterbegin',`<div class="sec" id="howread"><div class="eb">Start here</div><h2>How to read this report</h2><div class="g2"><ul class="hr">
  <li><b>Tabs</b> follow the candidate's journey: Applications → Recruitment → Exits, then Learners &amp; clients, then Risks &amp; flags.</li>
  <li><b>Click a heading</b> to open a section. Each one starts with a short reading guide.</li>
  <li><b>Colours</b> group related numbers; a grey box means that field has no data yet.</li>
  <li><b>Record IDs</b> open the record in ClickUp. Names and personal details never appear here.</li>
  <li><b>All numbers</b> are from the snapshot of ${D.jobRun} SAST.</li></ul>
  <div><h3>Words used in this report</h3><dl class="gl">${GLOSS.map(g=>`<dt>${g[0]}</dt><dd>${g[1]}</dd>`).join('')}</dl></div></div></div>`);
}
function setGuides(on){document.body.classList.toggle('noguide',!on);const b=document.getElementById('xtoggle');if(b){b.textContent=on?'Hide explanations':'Show explanations';b.setAttribute('aria-pressed',on)}try{localStorage.setItem('xg',on?'1':'0')}catch(e){}}
addGuides();addBlockGuides();
(()=>{const btn=document.querySelector('header .btn, header button');if(btn&&!document.getElementById('xtoggle'))btn.insertAdjacentHTML('afterend',' <button class="btn np" id="xtoggle" onclick="setGuides(document.body.classList.contains(\'noguide\'))">Hide explanations</button>');let on=true;try{on=localStorage.getItem('xg')!=='0'}catch(e){}setGuides(on)})();
</script>
