<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Apex renewal upload</title>
<style>
:root{--navy:#25247B;--yellow:#FBDC00;--ink:#1b1b2f;--muted:#5d5d73;--line:#dcdce6;--bg:#f5f5f9;--surf:#fff;--bad:#b42318;--ok:#1a7f4b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
.ring{width:30px;height:30px;border-radius:50%;border:4px solid var(--yellow);display:grid;place-items:center;font-weight:800;background:#fff;color:var(--navy);font-size:14px}
main{max-width:560px;margin:24px auto;padding:0 16px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:20px}
h1{font-size:20px;margin:0 0 6px}
p{margin:0 0 12px}
.sub{color:var(--muted);font-size:13px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);margin-bottom:14px}
input[type=date],input[type=text],input[type=email],input[type=tel],select,textarea,input[type=file]{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;width:100%}
textarea{min-height:70px;resize:vertical}
.chk{flex-direction:row;align-items:flex-start;gap:10px;color:var(--ink);font-size:14px}
.chk input{margin-top:3px;width:18px;height:18px}
button{font:inherit;font-weight:700;background:var(--navy);color:#fff;border:0;border-radius:10px;padding:12px 18px;width:100%;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.msg{padding:12px 14px;border-radius:10px;margin-bottom:14px}
.err{background:#fdecea;color:var(--bad)}
.done{background:#e8f5ee;color:var(--ok)}
</style>
</head>
<body>
<header><span class="ring">A</span><b>Apex practitioner records</b></header>
<main><div class="card" id="box"><p class="sub">Checking your link…</p></div>
<p class="sub" style="margin-top:14px">This link works once and expires. Apex uses the document only to keep your practitioner record and SETA registration up to date, under POPIA.</p></main>
<script>
const FN='https://qszikynltvyplzqootrc.supabase.co/functions/v1/fam-renew';
const t=new URLSearchParams(location.hash.slice(1)).get('t')||'';
history.replaceState(null,'',location.pathname+location.hash);
const box=document.getElementById('box'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>d?new Date(d.length===10?d+'T00:00:00':d).toLocaleDateString('en-ZA',{day:'numeric',month:'long',year:'numeric'}):'';
function submit(f,lab,ok){const m=document.getElementById('m');
  f.onsubmit=async ev=>{ev.preventDefault();const b=f.querySelector('button[type=submit]'),file=f.file.files[0];
    if(file&&file.size>10485760){m.innerHTML='<div class="msg err">The file is larger than 10 MB.</div>';return}
    b.disabled=true;b.textContent='Sending…';m.innerHTML='';
    const fd=new FormData(f);fd.append('t',t);
    try{const res=await fetch(FN,{method:'POST',body:fd}),j=await res.json();
      if(!res.ok){m.innerHTML=`<div class="msg err">${esc(j.error||'That did not work.')}</div>`;b.disabled=false;b.textContent=lab;return}
      box.innerHTML=`<h1>Thank you</h1><div class="msg done">${ok}</div>`;
    }catch(e){m.innerHTML='<div class="msg err">Sending failed. Check your connection and try again.</div>';b.disabled=false;b.textContent=lab}}}
function prof(r){const c=r.current||{},opt=(l,v)=>['',...l].map(o=>`<option value="${esc(o)}" ${o===v?'selected':''}>${esc(o||'Choose…')}</option>`).join('');
  box.innerHTML=`<h1>Hi ${esc(r.first||'there')}</h1><p>Please check your details and change anything that is out of date. Leave a field as it is if it is still right.</p><p class="sub">Link valid until ${fmt(r.link_expires)}.</p><div id="m"></div>
  <form id="f"><label>Email<input type="email" name="email" maxlength="120" value="${esc(c.email)}"></label><label>Phone<input type="tel" name="phone" maxlength="30" value="${esc(c.phone)}"></label>
  <label>Physical address<input type="text" name="address" maxlength="300" value="${esc(c.address)}"></label><label>Province<select name="province">${opt(r.provinces||[],c.province)}</select></label>
  <label>City or town<input type="text" name="city" maxlength="80" value="${esc(c.city)}"></label><label>Languages you can facilitate in (comma separated)<input type="text" name="languages" maxlength="200" value="${esc(c.languages)}"></label>
  <label>How you can deliver<select name="delivery">${opt(r.delivery||[],c.delivery)}</select></label>
  <fieldset style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 14px"><legend class="sub">Dates you are not available (optional)</legend><label>From<input type="date" name="away_from"></label><label>To<input type="date" name="away_to"></label><label>Reason (optional)<input type="text" name="away_reason" maxlength="120"></label></fieldset>
  <label>Supporting document, e.g. work permit or updated CV (optional; PDF, JPG or PNG, max 10 MB)<input type="file" name="file" accept=".pdf,.jpg,.jpeg,.png"></label>
  <label>Note for Apex (optional)<textarea name="note" maxlength="500"></textarea></label>
  <label class="chk"><input type="checkbox" name="consent" value="yes" required><span>I consent to Apex keeping these details, and any document I attach, on my practitioner record to match me to work and meet SETA requirements, under POPIA.</span></label>
  <button type="submit">Send my details</button></form>`;
  submit(document.getElementById('f'),'Send my details','Your details were received. Apex will review them and update your record. You can close this page.')}
const fail=m=>box.innerHTML=`<h1>Link not available</h1><div class="msg err">${esc(m)}</div>`;
(async()=>{
  if(!t)return fail('This link is incomplete. Open it straight from the email Apex sent you.');
  let r;try{const res=await fetch(FN+'?t='+encodeURIComponent(t));r=await res.json();if(!res.ok)return fail(r.error||'This link is not valid.')}catch(e){return fail('Could not reach Apex. Check your connection and refresh.')}
  if(r.profile)return prof(r);
  const minD=(()=>{const t=new Date();t.setDate(t.getDate()+1);const c=t.toISOString().slice(0,10);return r.current_expiry&&r.current_expiry>=c?new Date(new Date(r.current_expiry+'T00:00:00Z').getTime()+864e5).toISOString().slice(0,10):c})();
  box.innerHTML=`<h1>Hi ${esc(r.first||'there')}</h1>
  <p>Please upload your renewed <b>${esc(r.seta?r.seta+' registration':r.what)}</b>${r.current_expiry?` (currently expires ${fmt(r.current_expiry)})`:''}.</p>
  <p class="sub">Link valid until ${fmt(r.link_expires)}.</p>
  <div id="m"></div>
  <form id="f">
    <label>Document (PDF, JPG or PNG, max 10 MB)<input type="file" name="file" accept=".pdf,.jpg,.jpeg,.png" required></label>
    <label>New expiry date (after ${r.current_expiry?fmt(r.current_expiry):"today"})<input type="date" name="expiry" required min="${minD}"></label>
    <label>Registration number (if it changed)<input type="text" name="reg_no" maxlength="60" autocomplete="off"></label>
    <label>Note for Apex (optional)<textarea name="note" maxlength="500"></textarea></label>
    <label class="chk"><input type="checkbox" name="consent" value="yes" required><span>I consent to Apex storing this document and these details on my practitioner record for SETA compliance.</span></label>
    <button type="submit">Upload</button>
  </form>`;
  submit(document.getElementById('f'),'Upload','Your document was received. Apex will review it and update your record. You can close this page.');
})();
</script>
</body>
</html>
